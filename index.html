s**, retaliation. 'Adult only,' 'no children,' 'perfect for single professionals' are problematic.", "**Exemptions** (Fair Housing Act): **sale of a single-family home by an owner** who owns ≤3 houses, uses no broker and no discriminatory advertising; **rental of rooms in an owner-occupied building with ≤4 units** (Mrs. Murphy); **religious organizations** and **private clubs** (limited to members); **housing for older persons** (55+ with at least 80% of units having one occupant 55+ and an intent to operate as such, or 62+ housing). Brokers can't use exemptions.", "**Disability**: landlords must permit **reasonable modifications** (at the tenant's expense in private housing) and make **reasonable accommodations** in rules (e.g., assistance animals). New multifamily construction (4+ units, first occupancy after March 1991) must meet design standards. **ADA** Title III requires public accommodations (including a broker's office) to be accessible.", "**Enforcement**: complaint to HUD within **1 year**, or lawsuit in court within **2 years**. HUD may refer to an administrative law judge; penalties include actual damages, injunctions, civil penalties (adjusted annually), and attorney's fees. **Testers** and the *Fair Housing Congress* approach (audits) are used.", "**Advertising rule**: describe the property, not the preferred occupant. Use the Equal Housing Opportunity logo/statement. **Describe, don't characterize** neighborhoods. **Treat all clients the same**."], "key": ["Seven federally protected classes under FHA", "Familial status protects households with children under 18", "Civil Rights Act of 1866 has no exemptions and covers race"], "example": "An agent tells a family with kids, 'You'd like the east side, it has more families.' That is steering. Provide the same listings to everyone who meets criteria.", "confirm": []}, {"title": "Disclosure, trust funds, antitrust and technology", "body": ["**Material facts**: facts that would influence a reasonable buyer's decision (structural defects, flooding, zoning, liens). **Stigmatized property** (death, crime, haunted) disclosures are state-specific; most states don't require agents to disclose deaths/crimes/HIV status, and HIV/AIDS status is **never** to be disclosed. **Megan's Law** sex-offender data is public, and agents should refer to official registries rather than advise. **Seller property condition disclosure** is required in many states; **'as is'** doesn't excuse fraud or concealment of known latent defects.", "**Trust funds**: **Commingling** (mixing client funds with the broker's own) and **conversion** (using client funds) are serious violations. Keep a separate trust account, keep records, reconcile monthly, and release only per the contract or a written agreement/court order.", "**Antitrust** — Sherman Act: **price fixing**, **group boycotts**, **tie-in arrangements**, **market allocation** are illegal and can bring criminal penalties. Commissions are never set by law or association.", "**Unauthorized practice of law** — licensees may fill in approved blanks on **standard forms**, but not draft contracts or give legal advice; when in doubt, refer to an attorney.", "**Advertising**: must be truthful, include the broker's name (as licensed) clearly, and not mislead; salespeople can't advertise on their own without broker identification and approval.", "**Technology & privacy**: TCPA/Do Not Call, CAN-SPAM, **Gramm-Leach-Bliley** safeguards for consumer financial data, **wire fraud**, e-signatures valid under **E-SIGN/UETA**, social media compliance, and cyber hygiene.", "**Ethics**: **Realtor® Code of Ethics** (NAR) — duties to clients, customers, public and other Realtors®; arbitration of disputes between members. A license is not the same as membership in NAR."], "key": ["Never disclose HIV/AIDS status", "'As is' doesn't protect against concealed latent defects", "Commingling = mixing funds; conversion = using them"], "example": "A broker deposits an earnest check into the office operating account to cover payroll for a week. That is commingling and conversion.", "confirm": []}], "quiz": [{"id": "N8-1", "q": "Which is NOT a federally protected class?", "o": ["age", "familial status", "disability", "national origin"], "a": 0, "why": "Age is not among the seven."}, {"id": "N8-2", "q": "Familial status protects:", "o": ["households with children under 18", "married couples only", "seniors", "veterans"], "a": 0, "why": "Includes pregnant women."}, {"id": "N8-3", "q": "Steering is:", "o": ["guiding buyers toward or away from areas based on a protected class", "a lawful marketing practice", "showing every listing", "an exemption"], "a": 0, "why": "Illegal."}, {"id": "N8-4", "q": "Blockbusting is:", "o": ["inducing panic selling by suggesting protected-class entry will lower values", "a loan practice", "lawful advertising", "a title issue"], "a": 0, "why": "Illegal."}, {"id": "N8-5", "q": "The Civil Rights Act of 1866 covers:", "o": ["race discrimination in all property transactions", "only rentals", "only sales by brokers", "religion only"], "a": 0, "why": "No exemptions."}, {"id": "N8-6", "q": "A homeowner selling their single-family home without a broker or discriminatory ads may qualify for:", "o": ["an exemption under the Fair Housing Act", "an exemption under the 1866 Act", "no exemption ever", "tax-free sale"], "a": 0, "why": "Limited exemption."}, {"id": "N8-7", "q": "A tenant with a disability asks to install a ramp. The landlord must generally:", "o": ["permit reasonable modifications, usually at the tenant's expense", "refuse", "pay for it always", "evict"], "a": 0, "why": "FHA requirement."}, {"id": "N8-8", "q": "An HUD complaint must be filed within:", "o": ["1 year", "30 days", "6 months", "5 years"], "a": 0, "why": "Court action is 2 years."}, {"id": "N8-9", "q": "Advertising 'no children' is:", "o": ["a violation based on familial status", "permitted", "required for seniors", "a rental standard"], "a": 0, "why": "Unless qualifying housing for older persons."}, {"id": "N8-10", "q": "Mixing client money with the broker's funds is:", "o": ["commingling", "conversion", "escrow", "proration"], "a": 0, "why": "Commingling."}, {"id": "N8-11", "q": "Using client funds for personal use is:", "o": ["conversion", "commingling", "a lawful loan", "a proration"], "a": 0, "why": "Conversion."}, {"id": "N8-12", "q": "An agent should disclose a buyer's HIV status:", "o": ["never", "always", "upon request", "to the lender"], "a": 0, "why": "Must not disclose."}, {"id": "N8-13", "q": "Price fixing is a violation of the:", "o": ["Sherman Antitrust Act", "Fair Housing Act", "RESPA", "TILA"], "a": 0, "why": "Antitrust."}, {"id": "N8-14", "q": "Licensees may:", "o": ["complete blanks on approved forms", "draft custom contracts", "give legal advice", "interpret contracts as an attorney"], "a": 0, "why": "UPL limits."}, {"id": "N8-15", "q": "The Equal Housing Opportunity logo in an ad shows:", "o": ["a commitment to fair housing", "a tax exemption", "board membership", "a discount"], "a": 0, "why": "Required good practice."}], "drill": false}, {"id": "N9", "part": "National", "title": "Leases, Property Management & Specialty Areas", "objectives": ["Write and interpret leases", "Explain landlord and tenant duties and remedies", "Understand property management roles and specialty property types"], "lessons": [{"title": "Leases and landlord-tenant fundamentals", "body": ["A **lease** conveys possession and use (a leasehold estate) for consideration (rent). The **landlord/lessor** retains the **reversionary interest**; the **tenant/lessee** holds the leasehold. Leases over one year must generally be in writing (statute of frauds).", "**Types of leases**: **gross** (landlord pays operating expenses), **net / single-net / double-net / triple-net (NNN)** (tenant pays some or all taxes, insurance, maintenance), **percentage** (rent = base + % of tenant's gross sales), **graduated** (scheduled increases), **index** (tied to an index), **ground lease** (tenant leases land and builds improvements; long-term, typically 50–99 years), **sandwich lease** (a sublessor stands between the owner and the occupant).", "**Assignment** transfers the tenant's entire interest; **sublease** transfers part (partial space or term) with the original tenant remaining liable; both usually require landlord consent.", "**Landlord duties**: deliver possession, quiet enjoyment, maintain habitability (**implied warranty of habitability** in residential leases), and follow fair housing laws. **Tenant duties**: pay rent, care for premises, avoid waste. **Constructive eviction** — the tenant moves out because the landlord's failure makes the premises uninhabitable; the tenant's rent duty ends if they vacate. **Retaliatory eviction** is illegal in many states. **Actual eviction** requires a court process; self-help (changing locks, shutting off utilities) is generally illegal.", "**Security deposits** are held per statute; states regulate how long to return the deposit and itemization.", "**Lease termination**: expiration, surrender and acceptance, mutual agreement, breach, destruction of property, eminent domain. Death of either party does not automatically end a lease; **foreclosure** may (depending on law and notice). A sale doesn't end a lease. **Estoppel certificate** confirms lease terms to a buyer or lender."], "key": ["Triple-net: tenant pays taxes, insurance and maintenance", "Constructive eviction needs the landlord's failure plus the tenant vacating", "Self-help eviction is generally illegal"], "example": "A retail lease sets base rent $4,000/month plus 5% of gross sales over $600,000/year. That is a percentage lease with a breakpoint.", "confirm": []}, {"title": "Property management and specialty areas", "body": ["A **property manager** is an agent of the owner under a **management agreement**: duties include renting, collecting rent, maintaining the property, hiring vendors, budgeting, accounting, reporting. Compensation is usually a percentage of collected rent plus leasing fees. The owner sets policies; the manager follows instructions and keeps trust accounts separate. In many states a property manager must hold a real estate license.", "**Budgets and reports**: **operating budget**, **reserves**, **owner statements**, **rent roll**, **vacancy/turnover cost**. **Maintenance types**: preventive, routine, emergency, deferred, capital improvements.", "**Tenant selection** must follow fair housing law; use consistent written criteria and screening for all applicants.", "**Specialty and property types**: residential (1–4 units, multifamily), commercial (office, retail, hospitality), industrial, agricultural, special purpose. **Subdivision & development**, **land use**: platting, utilities, zoning, impact studies. **Farms/ranches**: water rights, mineral rights, soil, crop-share leases. **Timber, coastal and flood-prone land**: easements and regulation. **Commercial** metrics: cap rate, NOI, DSCR, vacancy, CAM charges.", "**Insurance basics**: homeowner's policy forms (HO-3 covers an open-peril dwelling and named-peril personal property); **coinsurance** (80% rule penalizes underinsurance); **flood insurance** is separate; **replacement cost vs actual cash value**; **liability coverage**.", "**Home inspections** and **warranties** manage buyer risk, but do not replace seller disclosure."], "key": ["Property manager is an agent bound by the management agreement", "Coinsurance penalty applies when insured below the required % of value", "HO-3 covers dwelling on open-peril basis"], "example": "Replacement cost $300,000; policy requires 80% ($240,000) but owner carries $180,000; a $20,000 loss pays 180/240 × $20,000 = $15,000.", "confirm": []}], "quiz": [{"id": "N9-1", "q": "A lease where the tenant pays taxes, insurance and maintenance is a:", "o": ["triple-net lease", "gross lease", "graduated lease", "sandwich lease"], "a": 0, "why": "NNN."}, {"id": "N9-2", "q": "Rent that increases on a pre-set schedule is a:", "o": ["graduated lease", "percentage lease", "gross lease", "net listing"], "a": 0, "why": "Graduated."}, {"id": "N9-3", "q": "A tenant who transfers only part of their interest and remains liable has made a:", "o": ["sublease", "assignment", "novation", "surrender"], "a": 0, "why": "Sublease."}, {"id": "N9-4", "q": "Constructive eviction occurs when:", "o": ["the landlord's failure makes the premises uninhabitable and the tenant vacates", "the sheriff evicts", "the tenant refuses to pay", "the lease expires"], "a": 0, "why": "Tenant leaves."}, {"id": "N9-5", "q": "A ground lease is typically:", "o": ["long-term", "month-to-month", "gross", "residential only"], "a": 0, "why": "50–99 years."}, {"id": "N9-6", "q": "A percentage lease is common in:", "o": ["retail properties", "farms only", "single-family homes", "condos"], "a": 0, "why": "Based on sales."}, {"id": "N9-7", "q": "Death of a tenant generally:", "o": ["does not automatically end the lease", "terminates the lease", "terminates the lease for life", "transfers title"], "a": 0, "why": "Rules vary."}, {"id": "N9-8", "q": "A property manager is bound by:", "o": ["the management agreement", "the MLS rules", "the tenant's lease only", "title insurance"], "a": 0, "why": "Agency."}, {"id": "N9-9", "q": "An estoppel certificate:", "o": ["confirms lease terms for a buyer or lender", "creates a lease", "evicts a tenant", "insures title"], "a": 0, "why": "Verifies terms."}, {"id": "N9-10", "q": "The most common homeowners form for a single-family dwelling is:", "o": ["HO-3", "HO-4", "HO-6", "HO-8"], "a": 0, "why": "Open peril dwelling."}, {"id": "N9-11", "q": "Homeowners flood damage is:", "o": ["excluded and requires a separate policy", "covered", "covered by title insurance", "covered by PMI"], "a": 0, "why": "Flood is separate."}, {"id": "N9-12", "q": "Self-help eviction (changing locks) is generally:", "o": ["illegal", "required", "best practice", "legal after a week"], "a": 0, "why": "Court process."}], "drill": false}, {"id": "N10", "part": "National", "title": "Real Estate Math (Formula Sheet & Drills)", "objectives": ["Memorize the core formulas", "Solve percentage, commission, loan, proration, area and appraisal problems", "Use the built-in drills until you can solve each type in under 90 seconds"], "lessons": [{"title": "The percent triangle and commission math", "body": ["Almost every real estate math problem reduces to **Part = Whole × Rate**. Draw the triangle: **Part** on top, **Whole** and **Rate** on the bottom. Cover what you want: Part = Whole × Rate; Whole = Part ÷ Rate; Rate = Part ÷ Whole. Convert percents to decimals (6% = 0.06; 2.5% = 0.025).", "**Commission** = sale price × commission rate. **Split**: broker's share and salesperson's share (e.g., 60/40 split of the commission). **Net to seller** = sale price − commission − payoff − closing costs. To find the **price needed to net a target**: Price = (target net + costs and payoff) ÷ (1 − commission rate).", "**Profit/loss and appreciation**: Percent change = (new − old) ÷ old.", "**Worked**: House sells for $240,000; commission 6%; listing side gets 50%; salesperson gets 60% of the listing side. Commission = 14,400; listing side = 7,200; salesperson = 4,320."], "key": ["Part = Whole × Rate", "Price to net a target = (net + costs) ÷ (1 − commission rate)", "Percent change = (new − old) ÷ old"], "example": "Seller wants to net $190,000 after a 6% commission and $5,000 of costs/payoff beyond that: price = (190,000 + 5,000) ÷ 0.94 = $207,446.81 (rounded).", "confirm": []}, {"title": "Loans, interest, points, LTV and ratios", "body": ["**Simple interest** = principal × rate × time (years). Monthly interest on a balance = balance × annual rate ÷ 12. **First-month payment split**: interest = balance × rate ÷ 12; principal = payment − interest; new balance = balance − principal.", "**LTV** = loan ÷ lesser of price or appraised value. **Down payment** = price − loan. **Points** = loan × (points ÷ 100). **PITI** = principal + interest + taxes + insurance; monthly taxes = annual ÷ 12.", "**Front-end ratio** = PITI ÷ gross monthly income; **back-end ratio** = (PITI + other monthly debts) ÷ gross monthly income. **Maximum payment** = income × ratio.", "**Amortization factors**: exams often give a payment factor per $1,000 (e.g., $6.00 per $1,000 at a given rate and term). Monthly P&I = (loan ÷ 1,000) × factor. The factor depends on rate and term; use the one given.", "**Debt service coverage** = NOI ÷ annual debt service. **Cash-on-cash** = annual pre-tax cash flow ÷ cash invested."], "key": ["Monthly interest = balance × annual rate ÷ 12", "LTV uses the lesser of price or appraisal", "Monthly P&I = (loan ÷ 1,000) × factor"], "example": "$180,000 loan at 5%: first-month interest = 180,000 × 0.05 ÷ 12 = $750. If the payment is $966.28, principal = $216.28 and the new balance is $179,783.72.", "confirm": []}, {"title": "Prorations, area, appraisal and tax math", "body": ["**Prorations**: daily rate = annual amount ÷ 360 (statutory year, 30-day months) or ÷ 365 (calendar year) — use the one the problem states. Multiply by the number of days owed. Taxes in arrears → seller owes; prepaid items (insurance, HOA dues paid ahead) → buyer reimburses the seller. If the buyer owns the closing day, count seller days through the day before.", "**Area**: rectangle = length × width; triangle = ½ × base × height; circle = π r². **Acres**: 1 acre = **43,560 sq ft**; section = 640 acres; 1 mile = 5,280 ft; volume = L × W × H (cubic feet ÷ 27 = cubic yards). Break irregular shapes into rectangles and triangles.", "**Appraisal**: Value = NOI ÷ cap rate; Cap rate = NOI ÷ value; **GRM** = price ÷ monthly rent; **Depreciated cost** = replacement cost − depreciation + land; **annual straight-line depreciation** = cost ÷ useful life. **Comparable adjustments**: add to the comp if the comp is inferior; subtract if superior.", "**Property tax**: assessed value = market value × ratio; tax = assessed value × millage ÷ 1,000. Mississippi Class I = 10%, Class II = 15%.", "**Documentary/transfer tax and survey problems** appear on some exams; read units carefully."], "key": ["43,560 sq ft per acre", "Statutory year = 360 days; calendar year = 365", "Comp inferior → add; comp superior → subtract"], "example": "Tax bill $3,600 for the calendar year; closing is March 31 and the buyer owns the closing day; taxes unpaid. Seller days = Jan 1–Mar 30 = 89 days (365-day year): 3,600 ÷ 365 × 89 = $877.81 credit to the buyer.", "confirm": []}], "quiz": [{"id": "N10-1", "q": "A home sells for $240,000 at a 6% commission. The commission is:", "o": ["$14,400", "$7,200", "$1,440", "$38,400"], "a": 0, "why": "240,000 × 0.06 = 14,400."}, {"id": "N10-2", "q": "A $14,400 commission is split 50/50 between listing and selling brokers; the listing salesperson gets 60% of the listing side. The salesperson earns:", "o": ["$4,320", "$8,640", "$2,880", "$7,200"], "a": 0, "why": "14,400 × .5 × .6 = 4,320."}, {"id": "N10-3", "q": "A seller wants to net $190,000 after a 6% commission and $5,000 in other costs. The sale price must be about:", "o": ["$207,447", "$206,400", "$210,900", "$183,300"], "a": 0, "why": "(190,000 + 5,000) ÷ 0.94."}, {"id": "N10-4", "q": "A buyer buys at $250,000, appraisal $240,000, and borrows $216,000. The LTV is:", "o": ["90%", "86.4%", "80%", "95%"], "a": 0, "why": "Use the lesser of price or value: 216/240 = 90%."}, {"id": "N10-5", "q": "Monthly interest on a $180,000 balance at 5.25% is:", "o": ["$787.50", "$9,450.00", "$181.73", "$26.25"], "a": 0, "why": "Balance × rate ÷ 12."}, {"id": "N10-6", "q": "Three discount points on a $275,000 loan cost:", "o": ["$8,250", "$825", "$82,500", "$688"], "a": 0, "why": "1 point = 1% of the loan."}, {"id": "N10-7", "q": "PITI of $1,850 on gross monthly income of $6,500 gives a front-end ratio of about:", "o": ["28.5%", "34.6%", "2.4%", "40.0%"], "a": 0, "why": "1,850 ÷ 6,500."}, {"id": "N10-8", "q": "PITI $1,850 plus $450 of other debts on $6,500 income gives a back-end ratio of about:", "o": ["35.4%", "28.5%", "6.9%", "2.9%"], "a": 0, "why": "(1,850 + 450) ÷ 6,500."}, {"id": "N10-9", "q": "A lot measures 200 ft by 435.6 ft. Its area in acres is:", "o": ["2", "1", "0.5", "5"], "a": 0, "why": "87,120 sq ft ÷ 43,560 = 2 acres."}, {"id": "N10-10", "q": "The S½ of the NW¼ of the SE¼ of a section contains how many acres?", "o": ["20", "40", "80", "10"], "a": 0, "why": "640 → 160 → 40 → 20."}, {"id": "N10-11", "q": "An income property has NOI of $84,000 and a market cap rate of 8%. Its value is:", "o": ["$1,050,000", "$6,720", "$933,333", "$1,008,000"], "a": 0, "why": "84,000 ÷ 0.08."}, {"id": "N10-12", "q": "A building sold for $1,200,000 and produces NOI of $102,000. The cap rate is:", "o": ["8.5%", "10.2%", "12.0%", "11.8%"], "a": 0, "why": "102,000 ÷ 1,200,000 = 8.5%."}, {"id": "N10-13", "q": "A rental sells for $135,000 and rents for $1,125 per month. The GRM is:", "o": ["120", "100", "12", "144"], "a": 0, "why": "135,000 ÷ 1,125 = 120."}, {"id": "N10-14", "q": "Annual taxes of $3,600 are unpaid at closing; the seller owes 89 days using a 365-day year. The credit to the buyer is about:", "o": ["$877.81", "$890.00", "$900.00", "$887.67"], "a": 0, "why": "3,600 ÷ 365 × 89."}, {"id": "N10-15", "q": "A Mississippi owner-occupied home (Class I) is worth $180,000 and the millage is 90. The tax is:", "o": ["$1,620", "$2,430", "$16,200", "$1,800"], "a": 0, "why": "180,000 × 10% = 18,000; × 0.090."}, {"id": "N10-16", "q": "A home bought at $200,000 is now worth $230,000. The appreciation rate is:", "o": ["15%", "13%", "30%", "23%"], "a": 0, "why": "30,000 ÷ 200,000."}, {"id": "N10-17", "q": "A comparable with a $14,000 pool sold for $310,000. The subject has no pool. The adjusted comparable price is:", "o": ["$296,000", "$324,000", "$310,000", "$282,000"], "a": 0, "why": "Comp is superior → subtract."}, {"id": "N10-18", "q": "A building costs $450,000 to replace, has depreciated 30% and the land is worth $90,000. The cost-approach value is:", "o": ["$405,000", "$225,000", "$315,000", "$360,000"], "a": 0, "why": "315,000 + 90,000."}, {"id": "N10-19", "q": "NOI of $60,000 and annual debt service of $48,000 gives a DSCR of:", "o": ["1.25", "0.80", "1.00", "1.50"], "a": 0, "why": "60,000 ÷ 48,000."}, {"id": "N10-20", "q": "A $180,000 loan at 5% has a $966.28 payment. The principal paid in the first month is:", "o": ["$216.28", "$750.00", "$966.28", "$1,716.28"], "a": 0, "why": "Payment minus interest 750."}], "drill": true}, {"id": "N11", "part": "National", "title": "Exam Strategy & Path to Licensure", "objectives": ["Plan your study and test-day approach", "Follow the Mississippi licensure steps", "Know where to verify rules that change"], "lessons": [{"title": "How to prepare and what to do on exam day", "body": ["**Study cycle**: learn a unit → take its quiz → review every miss → re-take after 24 hours → use the drills for math → finish with timed full-length practice. Aim for **85%+ on practice** before the real exam, because the real wording is harder than most practice questions.", "**Test tactics**: read the *last sentence first* to know what is asked; underline key words (**NOT, EXCEPT, FIRST, MOST, ALWAYS**); eliminate two answers; for math, **estimate** the answer first and check units (monthly vs annual); mark and return to unsure items; **never leave blanks**.", "**Common traps**: confusing *agent vs. customer*, *voidable vs. void*, *debit vs. credit*, *assessed vs. market value*, *gross vs. net*, *monthly vs. annual*, *principal vs. interest*; confusing federal and state rules (when the question says 'in Mississippi' pick the state rule).", "**Calculator**: bring the permitted type; practice with it. Know the formulas by heart.", "**State-specific law**: Mississippi law changes (2023 agency/PCDS changes; July 2026 revisions). When two sources disagree, rely on the **current MREC license law** and PSI's current candidate bulletin."], "key": ["Practice until you reliably score 85%+", "Watch NOT/EXCEPT/ALWAYS/NEVER", "Rely on the current MREC law and PSI bulletin"], "example": "Question: 'Which is NOT a duty of a seller's agent?' The answer is the item that is not obedience, loyalty, confidentiality, disclosure, accounting or reasonable care.", "confirm": []}, {"title": "Steps to a Mississippi license", "body": ["1. **Confirm eligibility** (age 18 for salesperson, Mississippi residency, background clearance).", "2. **Complete the 60-hour pre-license course** from an MREC-approved provider.", "3. **Apply** to MREC and register for the **PSI** exam; pass the **national (80 questions, 70%)** and **state (40 questions, 75%)** portions.", "4. **Choose a principal broker** to sponsor you; your license designates that broker.", "5. **Receive the temporary license** and complete the **30-hour post-license** course to earn the permanent license.", "6. **Renew** on time, complete **16 hours of CE** per renewal cycle (2 license law, 2 contract law, 4 agency, plus electives).", "**Always verify with**: MREC (mrec.ms.gov), the current PSI candidate bulletin, and your pre-license school. This course is a study aid, not legal advice or an official source."], "key": ["60 hours → exam → principal broker → 30-hour post-license", "Verify fees, forms and dates on MREC and PSI", "This course is not legal advice"], "example": "You pass the national portion but fail the state portion. Because both parts must be passed within the testing window, check PSI's current retake rules immediately.", "confirm": []}], "quiz": [{"id": "N11-1", "q": "When a question says 'EXCEPT', you should look for:", "o": ["the one choice that is false or does not apply", "the first correct choice", "the longest answer", "the answer that repeats the question"], "a": 0, "why": "Read for the odd one out."}, {"id": "N11-2", "q": "A good target before booking the exam is to score about:", "o": ["85% or higher on practice exams", "50%", "60%", "you cannot predict"], "a": 0, "why": "Margin for harder wording."}, {"id": "N11-3", "q": "After a new licensee's temporary license, the permanent license requires:", "o": ["the 30-hour post-license course", "a second exam", "a 2-year wait", "nothing further"], "a": 0, "why": "§73-35-14.5."}, {"id": "N11-4", "q": "The best source to resolve conflicting rule summaries is:", "o": ["the current MREC law and PSI bulletin", "a blog post", "the oldest textbook", "a forum"], "a": 0, "why": "Primary sources."}, {"id": "N11-5", "q": "When a stem says 'in Mississippi', choose the:", "o": ["state rule", "federal rule always", "national average", "most common rule elsewhere"], "a": 0, "why": "State-specific."}], "drill": false}, {"id": "S1", "part": "Mississippi", "title": "MREC, Licensing & Education", "objectives": ["Describe the Commission and who needs a license", "Meet salesperson and broker requirements and exam rules", "Manage renewal, continuing education, inactive status and principal-broker rules"], "lessons": [{"title": "The Commission, definitions and exemptions", "body": ["The **Mississippi Real Estate Commission (MREC)** administers the license law, Miss. Code Ann. **Title 73, Chapter 35** (§73-35-1 et seq.), and its rules (Title 30, Part 1601, Miss. Admin. Code). It has **five members appointed by the Governor with Senate consent**; each must have lived in Mississippi at least **six years** and worked as a broker at least **five years**; terms are **four years**, staggered.", "**Broker** (§73-35-3): a person or entity who, **for a fee or other valuable consideration**, lists, sells, buys, exchanges, rents, leases, manages or auctions real estate, negotiates such activities, or advertises as doing so. **Salesperson**: a person employed by or associated with a licensed broker to perform broker activities. **Real estate** includes leaseholds and any interest in land but **excludes oil, gas and mineral leases and interests**. A **broker price opinion** is an estimate of a probable selling price (it is not an automated valuation model).", "**One act for compensation can make a person a broker.** Performing licensed activity without a license is unlawful (§73-35-1).", "**Exemptions (§73-35-3)** — no license is required for:", "- bona fide **owners** dealing with their own property and their regular **salaried employees** in the regular course of business", "- **attorneys** acting in their legal capacity", "- holders of a good-faith **power of attorney** for a sale or lease", "- **receivers, trustees, administrators, executors, guardians**, or persons acting under court order, a **deed of trust** or a **will**", "- **public officers** performing their duties", "- persons dealing only in **oil and gas leases and mineral rights**", "- certain **life insurance companies** negotiating mortgage loans, and qualifying **FHA/VA-approved mortgagees and financial institutions**"], "key": ["Five-member Commission appointed by the Governor; four-year terms", "Law is Title 73, Chapter 35; rules are Title 30, Part 1601", "Owners, attorneys, POA holders, fiduciaries and public officers are exempt"], "example": "A property owner's salaried employee who leases the owner's apartments as part of regular duties is exempt; a friend paid a $500 finder's fee to steer a buyer to a house is not.", "confirm": ["Exemption text can be amended; the 2026 revised license law (July 1, 2026) is the current source."]}, {"title": "Becoming licensed: qualifications, exam, post-license", "body": ["**Salesperson** (§73-35-7): age **18+**, Mississippi residency, **60 hours** of approved pre-license education, pass the salesperson exam, and clear a **background check**. A salesperson must be associated with a **principal (responsible) broker**; the license designates the broker.", "**Broker**: age **21+**, Mississippi domicile, **12 months** as an active salesperson, **120 hours** of broker education, pass the broker exam, background clearance. A new broker signs a statement under penalty of perjury that he or she will **not hire salespersons for 36 months** after the salesperson license was approved; a broker who wants to hire sooner must have held an active license for 36 months and completed **150 classroom hours**.", "**Exam (PSI)**: salesperson exams combine **80 national** questions (**70% to pass**) and **40 Mississippi** questions (**75% to pass**). You must pass both portions in the same two-month window; the state portion allows a limited number of attempts before a waiting period (published policy: two attempts then a three-month wait).", "**Post-license**: a new licensee receives a **temporary** license and cannot receive the permanent license until completing a **30-hour post-license course** prescribed by the Commission (§73-35-14.5(3)).", "**Fees** are capped by statute (examples): application up to **$100**; additional broker license up to $75; changes, duplicates and additional offices up to $50; **inactive status $25**; **return to active $50**."], "key": ["Salesperson: 18+, 60 hours; Broker: 21+, 120 hours + 12 months", "National portion 70%; Mississippi portion 75%", "30-hour post-license course before the permanent license"], "example": "A salesperson licensed in January holds an active license for 36 months, finishes 150 classroom hours, and wants to hire an agent. That broker may hire sooner than a new broker barred for 36 months.", "confirm": ["Exam question counts, scoring and retake limits come from the PSI candidate bulletin; check the current bulletin before you test.", "Some secondary sources list different broker experience or education rules; the statute (§73-35-7) and MREC website control."]}, {"title": "Renewal, CE, inactive status and the principal broker", "body": ["**Renewal** (§73-35-17(4)): license renewals are due **annually by December 31, or biennially on a date the Commission sets**. Written delinquency notice goes to the licensee (and, where applicable, the responsible broker, including by email since July 2026). A license is **cancelled automatically** if fees remain unpaid **two months** after written notice; renewal during the grace period carries a **100% penalty**. Renewal fee caps: **$75/year broker; $60/year salesperson**.", "**Continuing education** (§73-35-18): **16 clock hours per two-year renewal**, with **no more than eight hours in required subjects** (the required topics are **2 license law, 2 contract law, 4 agency** under MREC's CE rules). The statute allows **up to six hours earned in the last three months** to carry over.", "**Inactive license**: a licensee may be inactive (cannot practice); pay the inactive fee to change status and the active fee to return.", "**Principal broker (§73-35-15)**: every license designates the **principal broker**. If the designation changes, written notice to MREC is due within **3 days** or the license is **cancelled automatically**. Brokers must have a **definite place of business** (may be a room in the home).", "**Salesperson cannot be paid by anyone but the employing broker** (§73-35-21(1)(l)); a salesperson **cannot sue** for commission in his or her own name against a client; the employing broker brings the action (§73-35-33)."], "key": ["16 CE hours; at most 8 in required topics (2 law, 2 contract, 4 agency)", "Principal broker change: 3 days or automatic cancellation", "Salespeople are paid only by their broker"], "example": "A salesperson transfers brokerages on the 1st and the new broker waits until the 8th to notify MREC. The license can be automatically cancelled for failing to give notice within 3 days.", "confirm": ["Renewal cycle and CE carryover rules are administered by MREC; confirm dates on the MREC website."]}], "quiz": [{"id": "S1-1", "q": "The Mississippi Real Estate Commission has how many members?", "o": ["five, appointed by the Governor", "seven elected", "three", "nine appointed by the Legislature"], "a": 0, "why": "§73-35-5."}, {"id": "S1-2", "q": "The Mississippi license law is found in:", "o": ["Title 73, Chapter 35", "Title 89, Chapter 8", "Title 27, Chapter 35", "Title 15, Chapter 3"], "a": 0, "why": "§73-35-1 et seq."}, {"id": "S1-3", "q": "A person who performs a single licensed act for compensation without a license:", "o": ["may be deemed a broker and violate the law", "is exempt", "may only be fined by the IRS", "is a salesperson"], "a": 0, "why": "One act can make a broker."}, {"id": "S1-4", "q": "Which person generally needs NO real estate license?", "o": ["an attorney acting in his or her legal capacity", "a property manager for a fee", "a finder paid a commission", "a friend paid to show houses"], "a": 0, "why": "§73-35-3 exemption."}, {"id": "S1-5", "q": "Pre-license education for a salesperson is:", "o": ["60 hours", "30 hours", "90 hours", "120 hours"], "a": 0, "why": "Broker needs 120."}, {"id": "S1-6", "q": "The minimum age to be a licensed Mississippi broker is:", "o": ["21", "18", "19", "25"], "a": 0, "why": "Salespersons: 18."}, {"id": "S1-7", "q": "The national portion of the salesperson exam has a passing score of:", "o": ["70%", "75%", "80%", "65%"], "a": 0, "why": "State portion is 75%."}, {"id": "S1-8", "q": "The Mississippi portion of the exam requires:", "o": ["75%", "70%", "80%", "65%"], "a": 0, "why": "Per PSI bulletin."}, {"id": "S1-9", "q": "Post-license education for a new licensee is:", "o": ["30 hours", "16 hours", "60 hours", "8 hours"], "a": 0, "why": "§73-35-14.5."}, {"id": "S1-10", "q": "CE required each renewal period is:", "o": ["16 hours", "8 hours", "30 hours", "24 hours"], "a": 0, "why": "§73-35-18."}, {"id": "S1-11", "q": "A change of principal broker must be reported to MREC within:", "o": ["3 days", "30 days", "10 days", "at renewal"], "a": 0, "why": "Else license cancels."}, {"id": "S1-12", "q": "A salesperson may accept compensation from:", "o": ["only the employing broker", "any seller", "the buyer directly", "any licensed broker"], "a": 0, "why": "§73-35-21(1)(l)."}, {"id": "S1-13", "q": "A salesperson who wants to collect an unpaid commission from a client must:", "o": ["have the employing broker bring the action", "sue in his or her own name", "file with MREC", "use small claims alone"], "a": 0, "why": "§73-35-33."}, {"id": "S1-14", "q": "A license is automatically cancelled if renewal fees remain unpaid how long after written notice?", "o": ["two months", "30 days", "one year", "six months"], "a": 0, "why": "§73-35-17(4)."}, {"id": "S1-15", "q": "New brokers who want to hire salespersons before 36 months must have held an active license 36 months and completed:", "o": ["150 classroom hours", "120 classroom hours", "60 classroom hours", "30 classroom hours"], "a": 0, "why": "§73-35-7."}], "drill": false}, {"id": "S2", "part": "Mississippi", "title": "Brokerage Relationships & Disclosures", "objectives": ["Explain the four relationships on MREC Form A", "Apply the written brokerage agreement requirement", "Describe disclosed dual agency limits and the PCDS change"], "lessons": [{"title": "Form A: Working With a Real Estate Broker", "body": ["Mississippi uses the MREC **'Working With a Real Estate Broker' (WWREB / Form A)** to explain relationships. Under the form, a licensee must provide it **when providing specific assistance** in a real estate transaction and **before exchanging confidential information that could affect the bargaining position**. The licensee gives a copy to all signatories and **keeps the signed original**.", "The form describes four roles:", "- **Seller's agent** — engaged by and acts as agent of the **seller only**. Owes the seller fiduciary duties: **loyalty, confidentiality, obedience, disclosure, full accounting**, and skill, care and diligence.", "- **Buyer's agent** — under a buyer agency agreement, acts as agent of the **buyer only**, with the same fiduciary duties.", "- **Disclosed dual agent** — acts for both with the **informed written consent of both**. Cannot represent one party to the exclusion or detriment of the other; owes the usual fiduciary duties **except full disclosure and undivided loyalty**; may not reveal that the seller will take less, the buyer will pay more, a party's motivation, or willingness to accept different financing — unless that party instructs otherwise in writing.", "- **Customer (unrepresented)** — a person the licensee does **not** represent. The licensee owes **honesty and fair dealing** but not fiduciary duties, cannot give legal or financial advice, and must disclose whom he or she represents.", "Every licensee, to every party, owes a **duty of honesty and fair dealing**."], "key": ["Form A has four roles: seller's agent, buyer's agent, disclosed dual agent, customer", "Dual agency requires informed written consent of both parties", "Give Form A before confidential information is exchanged"], "example": "A buyer walks into an open house and asks the listing agent what the seller will take. The agent is the seller's agent; the buyer is a customer. The agent must not reveal the seller's bottom line, and must tell the buyer he represents the seller.", "confirm": ["Form A describes these four roles. Designated agency or a 'transaction broker' category are not on Form A; do not assume them on the state exam."]}, {"title": "Written brokerage agreements, duties and the PCDS", "body": ["Mississippi's current brokerage relationships provisions (shown as updated in the July 2026 revised license law) say a consumer who is a seller or buyer may make an **affirmative election of a specific type of brokerage service**, and **a written brokerage agreement is required before a licensee lists a property for sale or submits an offer** for a buyer.", "**Compensation** must be set out in the agreement; commissions are **negotiable**.", "**Property Condition Disclosure Statement (PCDS)**: effective **March 14, 2023**, the amended law **eliminated licensee duties** (to clients or others) regarding the PCDS in residential transactions, according to the MREC's Form A. What a seller must still complete is a separate question; confirm it against the current statute. A licensee may not misrepresent what he or she **actually knows** about a property.", "**Material facts**: the duty of honesty and fair dealing means a licensee cannot conceal known material facts that affect value or desirability. **Stigmatized property**: Mississippi's disclosure rules for events like death or crime are narrow; follow current MREC guidance and refer legal questions to attorneys.", "**Duty to disclose agency** applies at **first substantive contact**; **dual agency** may not be created by implication."], "key": ["Written brokerage agreement is required before listing or submitting an offer", "Consumers may elect a specific brokerage service", "Licensee PCDS duties were eliminated March 14, 2023 (residential)"], "example": "A salesperson shows a buyer a house for sale with no signed buyer-broker agreement and then writes an offer. Under the written-agreement rule, the licensee should have a written brokerage agreement before submitting the offer.", "confirm": ["Exam outlines published before 2023 may still mention licensee PCDS duties. If a question asks about a licensee's PCDS duty, choose the answer consistent with the current law and ask your instructor or PSI if the stem is ambiguous."]}], "quiz": [{"id": "S2-1", "q": "Mississippi's agency disclosure form is:", "o": ["Working With a Real Estate Broker (Form A)", "the PCDS", "the Closing Disclosure", "the Lead Paint Pamphlet"], "a": 0, "why": "MREC form."}, {"id": "S2-2", "q": "Which role is NOT one of the four described on Form A?", "o": ["transaction broker", "seller's agent", "buyer's agent", "disclosed dual agent"], "a": 0, "why": "Form A lists seller's agent, buyer's agent, disclosed dual agent, customer."}, {"id": "S2-3", "q": "A licensee who represents the seller only is the:", "o": ["seller's agent", "dual agent", "customer", "buyer's agent"], "a": 0, "why": "Seller only."}, {"id": "S2-4", "q": "Disclosed dual agency requires:", "o": ["informed written consent of both parties", "oral consent from the seller", "consent of the Commission", "no consent"], "a": 0, "why": "Both must agree in writing."}, {"id": "S2-5", "q": "A disclosed dual agent may NOT reveal, without written instruction, that:", "o": ["the seller will accept less than the asking price", "the property is for sale", "the roof is leaking (known latent defect)", "the agent is licensed"], "a": 0, "why": "Bargaining information is protected."}, {"id": "S2-6", "q": "Form A must be given before:", "o": ["confidential information that might affect bargaining is exchanged", "closing", "the lender appraisal", "the walk-through"], "a": 0, "why": "Per form."}, {"id": "S2-7", "q": "A customer is owed:", "o": ["honesty and fair dealing", "fiduciary duties", "undivided loyalty", "advocacy on price"], "a": 0, "why": "Not a client."}, {"id": "S2-8", "q": "Before submitting an offer for a buyer, a licensee should have:", "o": ["a written brokerage agreement", "only an oral agreement", "a signed PCDS from the buyer", "a lender pre-approval"], "a": 0, "why": "Brokerage agreement rule."}, {"id": "S2-9", "q": "Commissions in Mississippi are:", "o": ["negotiable", "set by MREC", "set at 6%", "set by the MLS"], "a": 0, "why": "Never fixed."}, {"id": "S2-10", "q": "Effective March 14, 2023, licensee duties regarding the PCDS in residential transactions were:", "o": ["eliminated", "doubled", "unchanged", "moved to the buyer's lender"], "a": 0, "why": "Per MREC Form A."}, {"id": "S2-11", "q": "Who keeps the signed original of the agency disclosure acknowledgment?", "o": ["the licensee", "the buyer", "the lender", "the Commission"], "a": 0, "why": "Retain signed original."}, {"id": "S2-12", "q": "A licensee owes to every party a duty of:", "o": ["honesty and fair dealing", "undivided loyalty", "full advocacy", "price negotiation"], "a": 0, "why": "Baseline duty."}], "drill": false}, {"id": "S3", "part": "Mississippi", "title": "Trust Accounts, Records, Advertising & Discipline", "objectives": ["Handle earnest money and records under MREC rules", "Spot prohibited practices and their penalties", "Follow the discipline, hearing and appeal process"], "lessons": [{"title": "Earnest money, trust accounts and records", "body": ["Under §73-35-21(1)(f), a licensee who receives money belonging to others must deposit it in the **responsible broker's trust or escrow account within a reasonable time**, defined as **by the close of business of two banking days** following the date the licensee comes into possession of the funds (revised July 2026). A licensee must **account for** the funds and may not **commingle** them.", "Commission **Rule 3.4** governs earnest money and escrow: the broker holds the funds until closing or the contract terminates; disputes require **written agreement of the parties** or a **court order/interpleader**; releasing funds without proper authority is a violation. If the buyer and seller disagree about the earnest money, the broker should not decide who wins.", "**Cooperative agreements** (§73-35-11): a Mississippi broker holds earnest money in escrow **unless both buyer and seller agree otherwise in writing**.", "**Records**: brokers must keep transaction records (listings, contracts, agreements, disbursements, trust account records) for **three years** after closing or after the transaction fails, and make them available to the Commission on request.", "**Advertising**: ads must be truthful and show the **broker's name** as licensed; an agent cannot advertise without the principal broker's authority. A licensee may not place a 'for sale' sign on a property without the owner's authorization (§73-35-21(1))."], "key": ["Deposit by close of business of two banking days (statute, July 2026)", "Never decide an earnest money dispute alone", "Keep records three years"], "example": "Earnest money received Monday must be in the trust account by close of business Wednesday under the two-banking-day statute (and sooner is safer).", "confirm": ["An older version of Rule 3.4 was read as 'next banking day'; the revised statute says two banking days. Learn the statute, and check the current rule text before your exam."]}, {"title": "Prohibited practices and penalties", "body": ["**Grounds for discipline (§73-35-21)** include: **substantial misrepresentation**; **misleading advertising**; acting for **more than one party** or receiving compensation from more than one party **without all parties' knowledge**; **failing to account for or deliver** funds or documents; **conviction of a felony**; unauthorized **'for sale' signs**; **paying a commission to an unlicensed person**; and failing the background investigation. Salespeople may accept compensation only from their licensed employing broker.", "**Criminal penalties (§73-35-31)** for violating the chapter: first violation by a person — fine of **$500–$1,000** or up to **90 days** in jail, or both; by a corporation — up to **$2,000**; second or subsequent violation by a person — **$1,000–$2,000** or up to **six months**, or both; by a corporation — **$2,000–$5,000**. Officers or agents who participate are personally liable. A **civil penalty** — not less than the compensation received and up to **four times** that amount — may be recovered by an aggrieved person. No fee or commission may be paid to someone who cannot show a license or a cooperative agreement.", "**Suits for compensation (§73-35-33)**: a person cannot sue to recover a commission for an act requiring a broker's license unless licensed when the act was done.", "**Disciplinary process**: complaint → investigation → notice of hearing (at least **15 days**) → hearing before the Commission under a **clear and convincing evidence** standard. The Commission should dispose of a complaint (dismissal or formal complaint) within **120 days** of notice and reach **final disposition within one year**. A decision can be **appealed to circuit court within 30 days** of service (§73-35-25).", "**Sanctions**: reprimand, fine, suspension, revocation, required education."], "key": ["Paying commission to an unlicensed person is a violation", "15 days' notice; clear and convincing evidence; appeal to circuit court within 30 days", "Criminal fines escalate for second offenses"], "example": "A broker pays a $1,000 'referral' to a friend who is not licensed and who did not hold a cooperative agreement. That is a violation and exposes the broker to discipline.", "confirm": ["Administrative fine amounts and sanctions are set by statute/rule and may change; confirm with the current license law."]}], "quiz": [{"id": "S3-1", "q": "Earnest money received by a licensee must be deposited in the trust account by close of business of:", "o": ["two banking days", "the same day", "thirty days", "closing"], "a": 0, "why": "§73-35-21(1)(f) as revised July 2026."}, {"id": "S3-2", "q": "Mixing client funds with the broker's own funds is:", "o": ["commingling", "escrow", "proration", "novation"], "a": 0, "why": "Violation."}, {"id": "S3-3", "q": "In an earnest money dispute the broker should:", "o": ["hold the funds pending written agreement or court order", "give it to the seller", "give it to the buyer", "keep it as a fee"], "a": 0, "why": "Rule 3.4."}, {"id": "S3-4", "q": "Brokers must retain transaction records for:", "o": ["three years", "one year", "seven years", "one month"], "a": 0, "why": "MREC rule."}, {"id": "S3-5", "q": "Paying a commission to an unlicensed person is:", "o": ["grounds for discipline", "permitted if the amount is small", "required", "allowed with a cooperative agreement only"], "a": 0, "why": "§73-35-21."}, {"id": "S3-6", "q": "The standard of proof at an MREC hearing is:", "o": ["clear and convincing evidence", "beyond a reasonable doubt", "preponderance", "probable cause"], "a": 0, "why": "§73-35-23."}, {"id": "S3-7", "q": "A licensee must receive at least how many days' notice of a hearing?", "o": ["15", "5", "30", "60"], "a": 0, "why": "§73-35-23(1)."}, {"id": "S3-8", "q": "An MREC decision may be appealed to:", "o": ["circuit court within 30 days", "the Governor", "the Supreme Court within 10 days", "the MLS board"], "a": 0, "why": "§73-35-25."}, {"id": "S3-9", "q": "A first criminal violation by an individual carries a fine of:", "o": ["$500 to $1,000, up to 90 days in jail, or both", "$50 only", "$5,000", "no penalty"], "a": 0, "why": "§73-35-31."}, {"id": "S3-10", "q": "Compensation from violating the license law can lead to a civil penalty of up to:", "o": ["four times the amount received", "the amount received only", "$100", "ten times"], "a": 0, "why": "§73-35-31(2)."}, {"id": "S3-11", "q": "May a salesperson sue a client in his or her own name for commission?", "o": ["No; the employing broker brings the action", "Yes, always", "Yes, after 30 days", "Only with MREC approval"], "a": 0, "why": "§73-35-33."}, {"id": "S3-12", "q": "Earnest money is held in the Mississippi broker's escrow unless:", "o": ["both parties agree otherwise in writing", "the buyer is a veteran", "the lender objects", "the sale is over $200,000"], "a": 0, "why": "§73-35-11."}], "drill": false}, {"id": "S4", "part": "Mississippi", "title": "Mississippi Contracts, Transfer, Foreclosure & Homestead", "objectives": ["Apply statute-of-frauds and recording rules in Mississippi", "Explain homestead protections and spouse joinder", "Describe deed of trust power-of-sale foreclosure"], "lessons": [{"title": "Writing, recording and homestead", "body": ["Mississippi follows the **statute of frauds**: contracts for the sale of land and leases longer than a year must be written and signed. A licensee's authority to sell must also be in writing under the **written brokerage agreement** rule.", "**Recording**: deeds and security instruments are recorded with the **Chancery Clerk of the county** where the land lies, which gives notice to later purchasers and lenders. Recording does not make a deed valid; it protects priority.", "**Homestead (creditor protection)**: Mississippi's homestead exemption covers the owner's primary residence equity up to **160 acres or $75,000 in equity, whichever is lower**. The owner must file a claim; it is not automatic. **A married owner cannot mortgage or convey homestead property without the spouse's signed consent** — a conveyance without that consent can be void.", "**Property-tax homestead exemption** is different: it reduces ad valorem taxes on a primary residence and is claimed with the county tax assessor (see S6).", "**Closings**: in practice, closings are commonly handled by **attorneys or title companies**; licensees must not draft legal documents or give legal advice (unauthorized practice of law)."], "key": ["Record with the county Chancery Clerk", "Creditor homestead: up to 160 acres / $75,000 equity; spouse must consent to mortgage or conveyance", "Real estate contract must be in writing"], "example": "A husband signs a deed of trust on the family home without his wife's signature. Because homestead requires spousal consent, the lien may be invalid as to the homestead.", "confirm": ["Homestead dollar limits are set by statute and can change; confirm the current statute."]}, {"title": "Deeds of trust and non-judicial foreclosure", "body": ["Mississippi lenders commonly use a **deed of trust** naming a **trustee**. On default, the trustee may sell under the **power of sale** without going to court (**non-judicial foreclosure**).", "**Notice and sale (Miss. Code Ann. §89-1-55)**: the sale must be advertised **for three consecutive weeks** before the sale in a newspaper published in the county (or a paper with general circulation there), and a notice must be **posted at the county courthouse** for the same period. The notice must name the **original grantor(s)**. The sale is a **public outcry** held in the county where the land lies (or where the grantor resides). A sale without the required advertising is invalid, and a void sale is not cured by limitation periods other than adverse possession.", "**No statutory right of redemption** after a non-judicial foreclosure sale in Mississippi; the borrower's remedy is to cure or pay off **before the sale**. The trustee's deed conveys title to the purchaser.", "**Deficiency**: if sale proceeds fall short, the lender may seek a deficiency in some situations; always have counsel review.", "**Tax sales**: unpaid property taxes lead to an annual **tax sale** (generally spring or summer) and the owner has a **two-year redemption period**.", "Because foreclosure notices and rights turn on documents and local practice, licensees do not give legal advice; refer owners to an attorney or HUD-approved counselor."], "key": ["Deed of trust with power of sale is common", "Foreclosure ads run three consecutive weeks and a notice is posted at the courthouse", "No statutory redemption after the foreclosure sale"], "example": "A trustee advertises a sale only two weeks. Because the statute requires three consecutive weeks, the sale can be attacked as invalid.", "confirm": ["Additional notice-to-debtor requirements are set by the deed of trust and federal servicing rules; verify with an attorney."]}], "quiz": [{"id": "S4-1", "q": "Deeds in Mississippi are recorded with the:", "o": ["county Chancery Clerk", "Secretary of State only", "Circuit Clerk", "MREC"], "a": 0, "why": "County land records."}, {"id": "S4-2", "q": "A married owner conveying homestead needs:", "o": ["the spouse's signed consent", "no additional signature", "MREC approval", "court approval always"], "a": 0, "why": "Spousal joinder."}, {"id": "S4-3", "q": "Mississippi creditor homestead protection is up to:", "o": ["160 acres or $75,000 in equity, whichever is lower", "10 acres or $5,000", "unlimited", "$500,000"], "a": 0, "why": "Per Mississippi Bar summary."}, {"id": "S4-4", "q": "A deed of trust foreclosure under a power of sale is:", "o": ["non-judicial", "always judicial", "handled by MREC", "handled by the IRS"], "a": 0, "why": "Trustee sells."}, {"id": "S4-5", "q": "Foreclosure sale advertising under §89-1-55 runs:", "o": ["three consecutive weeks", "one week", "ten days", "six months"], "a": 0, "why": "Plus posting at the courthouse."}, {"id": "S4-6", "q": "The foreclosure notice must name the:", "o": ["original grantor(s)", "current tenant only", "real estate broker", "title company"], "a": 0, "why": "§89-1-55."}, {"id": "S4-7", "q": "After a non-judicial foreclosure sale, the borrower has:", "o": ["no statutory right of redemption", "a one-year redemption", "a 30-day redemption", "a two-year redemption"], "a": 0, "why": "Cure before the sale."}, {"id": "S4-8", "q": "The redemption period after a tax sale is:", "o": ["two years", "30 days", "one year", "ten years"], "a": 0, "why": "Tax sale redemption."}, {"id": "S4-9", "q": "A real estate licensee preparing a custom deed would be engaged in:", "o": ["unauthorized practice of law", "standard brokerage", "proration", "appraisal"], "a": 0, "why": "UPL."}, {"id": "S4-10", "q": "Is a homestead exemption from creditors automatic?", "o": ["No; the owner files a claim with the tax assessor", "Yes", "Only for veterans", "Only after 10 years"], "a": 0, "why": "Must file."}, {"id": "S4-11", "q": "Recording a deed provides:", "o": ["notice and priority", "validity", "a warranty", "a loan"], "a": 0, "why": "Constructive notice."}], "drill": false}, {"id": "S5", "part": "Mississippi", "title": "Mississippi Landlord-Tenant Law", "objectives": ["Apply the Mississippi Residential Landlord and Tenant Act", "Compute notice periods and deposit deadlines", "Distinguish lawful remedies from self-help"], "lessons": [{"title": "Deposits, notices and termination", "body": ["The **Mississippi Residential Landlord and Tenant Act** is in Miss. Code Ann. **Title 89, Chapter 8** (§89-8-1 et seq.). It applies to residential leases and sets duties for both sides.", "**Security deposits**: Mississippi sets **no cap**. The landlord may deduct unpaid rent and damage beyond ordinary wear, and must give the tenant a **written itemization**. The balance and itemization are due within **45 days** after the tenancy ends, the tenant delivers possession, and the tenant demands return (§89-8-21).", "**Month-to-month termination**: either party must give at least **30 days' written notice** (§89-8-19).", "**Nonpayment of rent**: the landlord may give written notice that the agreement terminates if rent isn't paid within **3 days** (§89-8-13).", "**Lease violations**: a **14-day notice to cure or quit** may be used; if a substantially similar violation recurs within **6 months**, a 14-day notice to quit may follow without a cure offer.", "**Landlord entry**: the state law doesn't set a fixed notice period; reasonable notice and reasonable hours are recommended, and **no notice is needed in an emergency**. **Late fees** must be in the lease; Mississippi sets no statutory cap.", "**Self-help evictions** (changing locks, removing belongings, shutting off utilities) create liability. Landlords must use the **court eviction process**.", "**Fair housing** laws apply to leasing and advertising."], "key": ["Deposit return: 45 days after move-out with written itemization", "30 days' written notice for month-to-month; 3 days after nonpayment notice", "14-day notice to cure or quit for lease violations"], "example": "A tenant moves out on March 1, returns the keys and demands the deposit. The landlord must deliver the balance and itemization by mid-April (45 days).", "confirm": ["Statute citations for notices vary by source (for example §89-8-13 vs. §89-7-27). Verify against the current code before relying on a citation."]}], "quiz": [{"id": "S5-1", "q": "The Mississippi Residential Landlord and Tenant Act is in Title:", "o": ["89, Chapter 8", "73, Chapter 35", "27, Chapter 33", "15, Chapter 3"], "a": 0, "why": "§89-8-1."}, {"id": "S5-2", "q": "Mississippi caps the const KEY='ms-realestate-course-v1';
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{done:{},quiz:{},missed:{},exams:[],drill:{}}}
let S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const U=DATA.units;const byId={};U.forEach(u=>byId[u.id]=u);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function renderBody(arr){let h='',inL=false;for(const p of arr){if(p.startsWith('- ')){if(!inL){h+='<ul class="l">';inL=true}h+='<li>'+inline(p.slice(2))+'</li>'}else{if(inL){h+='</ul>';inL=false}h+='<p>'+inline(p)+'</p>'}}if(inL)h+='</ul>';return h}
function doneCount(u){return (S.done[u.id]||[]).length}
function totalLessons(){return U.reduce((a,u)=>a+u.lessons.length,0)}
function totalDone(){return U.reduce((a,u)=>a+doneCount(u),0)}
let V={name:'home'};
function go(v){V=v;render();window.scrollTo(0,0)}
function nextLesson(){for(const u of U){const d=S.done[u.id]||[];for(let i=0;i<u.lessons.length;i++)if(!d.includes(i))return {u:u.id,i}}return null}

   return [['Area (sq ft)',fmtN(sf,2),'width × depth'],['Acres',fmtN(sf/43560,4),'sq ft ÷ 43,560'],['Square yards',fmtN(sf/9,2),'sq ft ÷ 9'],['Acres entered → sq ft',v.ac>0?fmtN(v.ac*43560,0):'—','acres × 43,560'],['Section fraction acres',names.length?fmtN(a,3)+' acres':'640 acres (whole section)',names.length?'The '+names.join(' of the ')+' of a section; 640 ÷ product of divisors':'']]}},
 invest:{name:'Income property',f:[['pgi','Potential gross income / yr ($)',120000],['vac','Vacancy & collection loss (%)',5],['opex','Operating expenses / yr ($)',42000],['cap','Market cap rate (%)',7.5],['price','Purchase price ($)',900000],['ds','Annual debt service ($)',55000],['cash','Cash invested ($)',250000]],
  c(v){const egi=v.pgi*(1-v.vac/100),noi=egi-v.opex;const cf=noi-v.ds;return [['Effective gross income',fmt$(egi),'PGI − vacancy'],['Net operating income (NOI)',fmt$(noi),'EGI − operating expenses (no debt service)'],['Value at market cap rate',fmt$(noi/(v.cap/100)),'NOI ÷ cap rate'],['Cap rate at purchase price',v.price>0?fmtP(100*noi/v.price):'—','NOI ÷ price'],['GRM (price ÷ monthly gross)',v.pgi>0?fmtN(v.price/(v.pgi/12),2):'—','price ÷ monthly PGI'],['DSCR',v.ds>0?fmtN(noi/v.ds,2):'—','NOI ÷ debt service (lenders often want ≥ 1.20)'],['Annual cash flow',fmt$(cf),'NOI − debt service'],['Cash-on-cash return',v.cash>0?fmtP(100*cf/v.cash):'—','cash flow ÷ cash invested']]}},
 cost:{name:'Cost & comp approach',f:[['rc','Replacement cost new ($)',400000],['dep','Accumulated depreciation (%)',25],['land','Land value ($)',80000],['comp','Comparable sale price ($)',300000],['adj','Feature value ($)',12000],['sup','Comparable is','sel:Superior (subtract),Inferior (add)']],
  c(v){return [['Depreciated improvements',fmt$(v.rc*(1-v.dep/100)),'replacement cost × (1 − depreciation)'],['Cost approach value',fmt$(v.rc*(1-v.dep/100)+v.land),'depreciated cost + land'],['Adjusted comparable',fmt$(v.sup.startsWith('Sup')?v.comp-v.adj:v.comp+v.adj),'adjust the COMP toward the subject: superior → subtract, inferior → add']]}},
 mstax:{name:'Mississippi property tax',f:[['val','True (market) value ($)',180000],['cls','Property class','sel:Class I – owner-occupied single-family (10%),Class II – other real property (15%),Class III – personal property (15%),Class IV – public service (30%),Class V – motor vehicles (30%)'],['mills','Millage rate (mills)',90],['sp','Special homestead exemption (65+/disabled)','sel:No,Yes – first $7,500 of assessed value exempt']],
  c(v){const ratio=+(v.cls.match(/\((\d+)%\)/)||[0,10])[1];const as=v.val*ratio/100;const taxable=v.sp.startsWith('Yes')?Math.max(0,as-7500):as;const tax=taxable*v.mills/1000;return [['Assessment ratio',ratio+'%','by class'],['Assessed value',fmt$(as),'value × ratio'],['Taxable assessed value',fmt$(taxable),v.sp.startsWith('Yes')?'after $7,500 special homestead exemption':'no exemption applied'],['Annual tax',fmt$(tax),'taxable assessed × mills ÷ 1,000'],['Monthly escrow',fmt$(tax/12),'÷ 12'],['Note','—','The regular homestead credit (capped at $300) is not computed here. Verify exemptions with the county tax assessor.']]}},
 qualify:{name:'Loan qualifying ratios',f:[['inc','Gross monthly income ($)',6500],['piti','Proposed PITI ($)',1850],['debt','Other monthly debts ($)',450]],
  c(v){return [['Front-end ratio',fmtP(100*v.piti/v.inc),'PITI ÷ income'],['Back-end ratio',fmtP(100*(v.piti+v.debt)/v.inc),'(PITI + debts) ÷ income'],['Max PITI at 28% front',fmt$(v.inc*.28),'income × 0.28'],['Max total debt at 36% back',fmt$(v.inc*.36),'income × 0.36'],['Max PITI at 36% back (conventional)',fmt$(v.inc*.36-v.debt),'0.36 × income − other debts'],['Max PITI at 31/43 (FHA-style)',fmt$(Math.min(v.inc*.31,v.inc*.43-v.debt)),'lesser of the two limits']]}},
};
function parseTool(t){return t.f.map(([k,l,d])=>{let ty='num',opts=null,def=d;if(typeof d==='string'){if(d.startsWith('sel:')){ty='sel';opts=d.slice(4).split(',');def=opts[0]}else if(d.startsWith('date:')){ty='date';def=d.slice(5)}}return {k,l,ty,opts,def}})}
function toolVals(id){const t=TOOLS[id];const f=parseTool(t);const saved=TV[id]||{};const v={};f.forEach(x=>{const s=saved[x.k];v[x.k]=x.ty==='num'?(s===undefined?x.def:s):(s===undefined?x.def:s)});return {f,v}}
function toolNums(id,v){const t=TOOLS[id],f=parseTool(t),o={};f.forEach(x=>{o[x.k]=x.ty==='num'?(parseFloat(String(v[x.k]).replace(/[$,%\s,]/g,''))||0):v[x.k]});return o}
function toolResult(id){const {v}=toolVals(id);return TOOLS[id].c(toolNums(id,v))}
function resultHtml(rows){return rows.map(r=>`<div class="card" style="padding:10px 12px"><div class="row"><div class="grow"><div style="font-size:13px;color:var(--dim)">${esc(r[0])}</div><div class="sol" style="margin:2px 0 0;font-size:11px">${esc(r[2]||'')}</div></div><div style="font:600 18px var(--fm);color:var(--gold2);text-align:right">${esc(r[1])}</div></div></div>`).join('')}
const SHEET=[
 ['Percent & commission',['Part = Whole × Rate','Commission = price × rate','Net to seller = price − commission − payoff − costs','Price to net a target = (target + costs) ÷ (1 − commission rate)','Percent change = (new − old) ÷ old']],
 ['Loans',['LTV = loan ÷ lesser of price or appraisal','Monthly interest = balance × annual rate ÷ 12','Points = loan × points ÷ 100','P&I = (loan ÷ 1,000) × payment factor','PITI = principal + interest + taxes + insurance','Front-end = PITI ÷ gross income; back-end = (PITI + debts) ÷ gross income','PMI generally required above 80% LTV; auto-terminates at 78%']],
 ['Appraisal & investment',['Value = NOI ÷ cap rate','Cap rate = NOI ÷ value','NOI = EGI − operating expenses (not debt service)','EGI = PGI − vacancy & collection loss','GRM = price ÷ monthly gross rent','Cost approach = replacement cost − depreciation + land','DSCR = NOI ÷ annual debt service','Cash-on-cash = annual cash flow ÷ cash invested','Comp superior → subtract; comp inferior → add']],
 ['Area & land',['1 acre = 43,560 sq ft','1 section = 640 acres = 1 sq mile; 1 township = 36 sections','1 mile = 5,280 ft; 1 sq yd = 9 sq ft; 1 cubic yd = 27 cu ft','Rectangle = L × W; triangle = ½ × base × height; circle = π r²','Section fractions: work from the END of the description backward']],
 ['Prorations',['Daily rate = annual ÷ 360 (statutory) or ÷ 365 (calendar)','Taxes paid in arrears: seller owes buyer (credit buyer)','Prepaid items: buyer reimburses seller (credit seller)','Buyer normally owns the closing day (seller days = through the day before)']],
 ['Mississippi property tax',['Class I 10% · Class II 15% · Class III 15% · Class IV 30% · Class V 30%','Assessed value = true value × ratio','Tax = assessed value × mills ÷ 1,000 (1 mill = $0.001)','Special homestead (65+/disabled): first $7,500 of assessed value exempt','Regular homestead credit capped at $300']],
 ['Key numbers',['TRID: Loan Estimate 3 business days after application; Closing Disclosure 3 business days before closing','Rescission: 3 business days (refinance of primary residence)','Lead paint: pre-1978 housing; 10-day inspection window','Radon action level: 4 pCi/L','1031 exchange: identify 45 days, close 180 days','Depreciation: 27.5 years residential rental, 39 years commercial']],
];
function toolsTabs(){return `<div class="btns" style="margin:0 0 12px">${[['drills','Drills'],['calc','Calculator'],['tools','Tools'],['sheet','Formulas']].map(([k,l])=>`<button class="btn ${MT===k?'':'ghost'} sm" data-act="mtab" data-t="${k}">${l}</button>`).join('')}</div>`}
function calcView(){
 const keys=['C','(',')','⌫','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+'];
 let h=`<p class="eyebrow">Practice</p><h1>Math & tools</h1>${toolsTabs()}<div class="card"><input class="num" id="cx" inputmode="none" value="${esc(CALC.expr)}" placeholder="0" autocomplete="off" style="font-size:22px"><div id="cout" style="font:600 26px var(--fm);color:var(--gold2);text-align:right;margin:8px 2px;min-height:34px">${esc(CALC.out)}</div>
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${keys.map(k=>`<button class="opt" style="margin:0;text-align:center;padding:14px 0;font-size:18px" data-act="ck" data-k="${k}">${k}</button>`).join('')}<button class="btn" style="grid-column:span 2;padding:14px" data-act="ck" data-k="^">xʸ</button><button class="btn" style="grid-column:span 2;padding:14px" data-act="ck" data-k="=">=</button></div></div>
 <p class="sub" style="font-size:13px">Supports + − × ÷, parentheses, % (5% = 0.05), and powers (1.005^360). Percent tip: 6% of 240000 → type <b>240000×6%</b>.</p>`;
 if(CALC.hist.length)h+=`<h3>History</h3>`+CALC.hist.slice(-6).reverse().map(x=>`<div class="card click" style="padding:8px 12px" data-act="hist" data-v="${esc(x[1])}"><span class="sub" style="margin:0">${esc(x[0])} = </span><b style="font-family:var(--fm)">${esc(x[1])}</b></div>`).join('');return h}
function toolsView(){
 const {f,v}=toolVals(TOOL);
 let h=`<p class="eyebrow">Practice</p><h1>Math & tools</h1>${toolsTabs()}<div class="btns" style="margin-top:0">${Object.keys(TOOLS).map(k=>`<button class="btn ${TOOL===k?'':'ghost'} sm" data-act="tool" data-t="${k}">${esc(TOOLS[k].name)}</button>`).join('')}</div><div class="card">`;
 f.forEach(x=>{h+=`<label style="display:block;font-size:12px;color:var(--dim);margin:8px 0 4px">${esc(x.l)}</label>`;
  if(x.ty==='sel')h+=`<select class="num tin" data-k="${x.k}" style="font-size:15px">${x.opts.map(o=>`<option ${v[x.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(x.ty==='date')h+=`<input class="num tin" type="date" data-k="${x.k}" value="${esc(v[x.k])}" style="font-size:16px">`;
  else h+=`<input class="num tin" inputmode="decimal" data-k="${x.k}" value="${esc(v[x.k])}" style="font-size:16px">`});
 h+=`</div><div id="tres">${resultHtml(toolResult(TOOL))}</div>`;return h}
function sheetView(){
 let h=`<p class="eyebrow">Reference</p><h1>Math & tools</h1>${toolsTabs()}`;
 SHEET.forEach(([t,a])=>{h+=`<h3>${esc(t)}</h3><div class="card"><ul class="l" style="margin:0">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`});return h}
function mathView(){return MT==='calc'?calcView():MT==='tools'?toolsView():MT==='sheet'?sheetView():drillsView()}
function calcPress(k){
 if(k==='C'){CALC.expr='';CALC.out=''}
 else if(k==='⌫'){CALC.expr=CALC.expr.slice(0,-1);CALC.out=''}
 else if(k==='='){const r=calcEval(CALC.expr);CALC.out=calcShow(r);if(isFinite(r)){CALC.hist.push([CALC.expr,CALC.out]);CALC.expr=CALC.out}}
 else{CALC.expr+=k;const r=calcEval(CALC.expr);CALC.out=isFinite(r)?calcShow(r):''}
}

/* ---------- Progress ---------- */
function progressView(){
 const td=totalDone(),tl=totalLessons();const nm=Object.keys(S.missed).length;
 let h=`<p class="eyebrow">Your record</p><h1>Progress</h1><div class="stat"><div><b>${td}/${tl}</b><span>Lessons</span></div><div><b>${Object.keys(S.quiz).length}/${U.length}</b><span>Units quizzed</span></div><div><b>${nm}</b><span>Missed to review</span></div></div><h2>Unit quiz scores</h2>`;
 U.forEach(u=>{const q=S.quiz[u.id];h+=`<div class="card"><div class="row"><div class="grow">${u.id} · ${esc(u.title)}</div>${q?`<span class="pill ${q.best>=85?'g':q.best<70?'b':''}">${q.best}%</span>`:'<span class="pill">—</span>'}</div></div>`});
 h+=`<h2>Sources</h2><ul class="l" style="font-size:13px">${DATA.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>
 <div class="btns"><button class="btn ghost sm" data-act="reset">Reset all progress</button></div>
 <div class="foot">${esc(DATA.disclaimer)}</div>`;return h}

/* ---------- Render + events ---------- */
function render(){
 let h='';
 switch(V.name){
  case 'home':h=home();break;
  case 'unit':h=unitView(byId[V.u]);break;
  case 'lesson':h=lessonView(byId[V.u],V.i);break;
  case 'quiz':h=quizView();break;
  case 'drills':h=mathView();break;
  case 'examhome':h=examHome();break;
  case 'progress':h=progressView();break;
 }
 $('#app').innerHTML=h;if(V.name==='home')raiseHouse();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='home'&&['home','unit','lesson'].includes(V.name))||b.dataset.v===V.name||(b.dataset.v==='examhome'&&V.name==='quiz'&&Q&&Q.kind!=='unit')));
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
 if(a==='mtab'){MT=t.dataset.t;if(MT==='drills'&&D&&D.res!==null)newDrill();render();return}
 if(a==='ck'){calcPress(t.dataset.k);render();return}
 if(a==='hist'){CALC.expr=t.dataset.v;CALC.out='';render();return}
 if(a==='tool'){TOOL=t.dataset.t;render();return}

 if(a==='nav'){go({name:t.dataset.v});if(t.dataset.v==='drills'&&D&&D.res!==null)newDrill();return}
 if(a==='unit')return go({name:'unit',u:t.dataset.u});
 if(a==='lesson')return go({name:'lesson',u:t.dataset.u,i:+t.dataset.i});
 if(a==='complete'){const u=byId[t.dataset.u],i=+t.dataset.i;const d=S.done[u.id]=S.done[u.id]||[];if(!d.includes(i))d.push(i);save();
  if(i<u.lessons.length-1)go({name:'lesson',u:u.id,i:i+1});else go({name:'unit',u:u.id});return}
 if(a==='quiz'){const u=byId[t.dataset.u];startQuiz('unit',shuffle(u.quiz).map(pickQ).map(q=>q),{unit:u.id,title:'Unit '+u.id+' quiz'});return}
 if(a==='startexam'){const n=shuffle(pool('National')).slice(0,80),s=shuffle(pool('Mississippi')).slice(0,40);startQuiz('exam',shuffle(n.concat(s)).map(pickQ),{title:'Exam simulator'});return}
 if(a==='startmini'){startQuiz('mini',shuffle(pool()).slice(0,20).map(pickQ),{title:'Mixed quiz'});return}
 if(a==='startmissed'){const ids=Object.keys(S.missed);const qs=pool().filter(q=>ids.includes(q.id));if(!qs.length)return;startQuiz('mini',shuffle(qs).map(pickQ),{title:'Missed questions'});return}
 if(a==='pick'){if(Q.locked&&Q.kind!=='exam')return;Q.sel=+t.dataset.k;render();return}
 if(a==='check'){Q.locked=true;Q.ans[Q.i]=Q.sel;render();return}
 if(a==='next'){if(Q.kind==='exam')Q.ans[Q.i]=Q.sel;Q.i++;Q.sel=null;Q.locked=false;render();window.scrollTo(0,0);return}
 if(a==='quitquiz'){if(confirm('Exit this quiz? Unsaved progress will be lost.'))go({name:Q.kind==='unit'?'unit':'examhome',u:Q.meta.unit});return}
 if(a==='grade'){const inp=$('#ans').value;const r=gradeDrill(inp,D);if(r===null){$('#ans').focus();return}D.res=r;const st=S.drill[D.g.id]=S.drill[D.g.id]||{c:0,n:0};st.n++;if(r)st.c++;save();render();return}
 if(a==='newdrill'){newDrill();render();return}
 if(a==='newdrillsame'){newDrill(D.g.id);render();return}
 if(a==='drilltype'){newDrill(t.dataset.t);render();return}
 if(a==='reset'){if(confirm('Erase all progress in this browser?')){S={done:{},quiz:{},missed:{},exams:[],drill:{}};save();go({name:'home'})}return}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.classList&&el.classList.contains('tin')){(TV[TOOL]=TV[TOOL]||{})[el.dataset.k]=el.value;const r=$('#tres');if(r)r.innerHTML=resultHtml(toolResult(TOOL));return}
 if(el.id==='cx'){CALC.expr=el.value;const r=calcEval(CALC.expr);CALC.out=isFinite(r)?calcShow(r):'';const o=$('#cout');if(o)o.textContent=CALC.out}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&V.name==='drills'&&MT==='calc'){calcPress('=');render();return}
 if(e.key==='Enter'&&V.name==='drills'&&MT==='drills'&&D&&D.res===null){const b=document.querySelector('[data-act=grade]');if(b)b.click()}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>

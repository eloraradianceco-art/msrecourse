<style>
:root{
 --ink:#0b1a28;--plan:#102a40;--plan2:#143450;--hover:#19405f;
 --chalk:#eaf2f5;--dim:#9bb2c1;--faint:#6a8396;--line:#2b516f;
 --cyan:#6fc3df;--pencil:#f6c61a;--lumber:#d9a441;--hazard:#ff7a2f;--pass:#5fd49a;--code:#07131e;
 --fd:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
 --fb:'Source Serif 4',Georgia,'Times New Roman',serif;
 --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
 --bad:var(--hazard);--good:var(--pass);--warn:var(--hazard);--gold:var(--pencil);--gold2:var(--pencil);--border:var(--line);--text:var(--chalk);--panel:var(--plan);--panel2:var(--plan2)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background-color:var(--ink);
 background-image:linear-gradient(rgba(111,195,223,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(111,195,223,.075) 1px,transparent 1px),linear-gradient(rgba(111,195,223,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(111,195,223,.04) 1px,transparent 1px);
 background-size:96px 96px,96px 96px,24px 24px,24px 24px;
 color:var(--chalk);font-family:var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:84px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 0}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.eyebrow{font:600 17px var(--fd);letter-spacing:.03em;color:var(--cyan);margin:0 0 2px}
h1{font:800 clamp(40px,11vw,56px)/.95 var(--fd);letter-spacing:.005em;margin:0 0 10px;text-wrap:balance}
h2{font:800 31px/1 var(--fd);letter-spacing:.005em;margin:34px 0 10px}
h3{font:800 23px/1.05 var(--fd);margin:26px 0 8px;color:var(--cyan)}
h4{font:800 19px var(--fd);margin:18px 0 4px}
p{margin:0 0 14px;font-size:17px}
.sub{color:var(--dim);font-size:16px;margin:0 0 18px}
strong,b{font-weight:600}
code{font-family:var(--fm);font-size:.84em;background:rgba(7,19,30,.85);border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:#ffe08a}
a{color:var(--pencil);text-underline-offset:3px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,19,30,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;position:relative;background:none;border:0;color:var(--faint);padding:9px 2px 8px;font:600 14px var(--fd);letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
.nav button.on{color:var(--pencil)}
.nav button.on::before{content:'';position:absolute;top:-1px;left:50%;width:30px;margin-left:-15px;height:3px;background:var(--pencil)}
/* surfaces */
.card{background:var(--plan);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin:0 0 10px}
.card.click{cursor:pointer;transition:background .15s,border-color .15s}.card.click:hover{background:var(--plan2);border-color:var(--cyan)}
.row{display:flex;gap:14px;align-items:center}.grow{flex:1;min-width:0}
.tag{font:600 15px var(--fd);letter-spacing:.03em;color:var(--cyan)}
.bar{height:8px;background:rgba(7,19,30,.9);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lumber)}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(11,26,40,.7) 11px 12px);pointer-events:none}
/* buttons: steel plate (chamfered) for the main action, outline for the rest */
.btn{background:var(--pencil);color:#1b1500;border:0;padding:11px 20px;font:800 17px var(--fd);letter-spacing:.05em;cursor:pointer;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--chalk);clip-path:none;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--line);padding:11px 16px}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--cyan);filter:none}
.btn.sm{padding:8px 14px;font-size:15px}.btn.sm.ghost{padding:8px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.back{background:none;border:0;color:var(--dim);font:600 16px var(--fd);letter-spacing:.03em;cursor:pointer;padding:0;margin-bottom:14px}
.back:hover{color:var(--chalk)}
ul.l{margin:0 0 14px;padding-left:20px;font-size:17px}ul.l li{margin:5px 0}
/* notes pinned with masking tape; cautions get hazard striping */
.callout{position:relative;background:var(--plan);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:14px 16px 10px;margin:20px 0 16px;border-radius:0 2px 2px 0}
.callout::before{content:'';position:absolute;top:-8px;left:14px;width:46px;height:15px;background:rgba(246,198,26,.55);transform:rotate(-2deg)}
.callout.key{border-left-color:var(--pencil)}
.callout.warn{border-left-color:transparent}
.callout.warn::after{content:'';position:absolute;left:-4px;top:-1px;bottom:-1px;width:4px;background:repeating-linear-gradient(135deg,var(--hazard) 0 5px,#2a1608 5px 10px)}
.callout.warn::before{background:rgba(255,122,47,.5)}
.callout p{font-size:16px;margin:0 0 8px}.callout p:last-child{margin:0 0 4px}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--plan);border:1.5px solid var(--line);color:var(--chalk);padding:13px 14px;border-radius:2px;margin:8px 0;font:400 17px var(--fb);cursor:pointer;transition:border-color .12s,background .12s}
.opt.mono{font-family:var(--fm);font-size:14px;white-space:pre-wrap}
.opt:hover{background:var(--plan2);border-color:var(--cyan)}.opt.sel{border-color:var(--pencil);background:var(--plan2)}
.opt.ok{border-color:var(--pass);background:rgba(95,212,154,.12)}.opt.no{border-color:var(--hazard);background:rgba(255,122,47,.12)}
.pill{display:inline-block;font:600 15px var(--fd);letter-spacing:.03em;padding:0 9px;border:1.5px solid var(--line);color:var(--dim);white-space:nowrap;border-radius:2px}
.pill.g{color:var(--pass);border-color:var(--pass)}.pill.b{color:var(--hazard);border-color:var(--hazard)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat div{background:var(--plan);border:1px solid var(--line);padding:10px 10px 12px;border-top:6px solid var(--lumber)}
.stat b{display:block;font:800 40px/1 var(--fd);color:var(--pencil)}.stat span{font:600 15px var(--fd);letter-spacing:.03em;color:var(--dim)}
.foot{font-size:14px;color:var(--faint);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.verse{font-style:italic;color:var(--dim);font-size:16px;margin:0 0 6px}

/* real estate additions */
.callout b.h{display:block;font:800 19px/1 var(--fd);letter-spacing:.03em;color:var(--cyan);margin:0 0 6px}
.callout.warn b.h{color:var(--hazard)}.callout.key b.h{color:var(--pencil)}
input.num,select.num{width:100%;background:var(--code);border:1px solid var(--line);border-top:3px solid var(--cyan);color:var(--chalk);padding:11px 12px;border-radius:2px;font:500 20px var(--fm)}
select.num{font-size:15px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input.num:focus,select.num:focus{outline:2px solid var(--pencil);outline-offset:0;border-color:var(--pencil)}
.sol{font:400 14px/1.5 var(--fm);color:var(--dim);white-space:pre-wrap;margin-top:8px}
.stat b{font-size:34px}
.card .row .grow{font-family:var(--fd);font-weight:800;font-size:22px;line-height:1.1}
.card .grow .sub,.card .grow .tag{font-family:var(--fb)}
.eyebrow{font-weight:600}
.house .built rect.f{fill:#173f5e;stroke:var(--lumber);stroke-width:3}
.card p .pill{white-space:normal;max-width:100%}
.house .built .sold{opacity:0;transition:opacity .8s 1.2s}
.house.done .built .sold{opacity:1}
.house .built .sign{fill:var(--pencil);stroke:var(--lumber);stroke-width:2}
.house .built text.sold{font:800 15px var(--fd);letter-spacing:.06em;fill:#1b1500;font-style:normal}
.stamp{display:inline-block;font:800 22px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--pass);border:3px solid var(--pass);padding:0 10px;border-radius:3px;transform:rotate(-5deg);background:rgba(11,26,40,.55)}
.stamp.bad{color:var(--hazard);border-color:var(--hazard)}
.stamp.pop{animation:thud .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes thud{0%{transform:rotate(-5deg) scale(2.1);opacity:0}70%{transform:rotate(-5deg) scale(.94);opacity:1}100%{transform:rotate(-5deg) scale(1)}}
.hero h1{font-size:clamp(46px,14vw,72px)}
.hero .sub{max-width:40ch}
/* home */
.hero h1{font-size:clamp(54px,17vw,88px);margin:0}
.hero .sub{max-width:34ch;margin:8px 0 6px;font-size:18px}
.house{display:block;width:100%;height:auto;margin:4px 0 6px;overflow:visible}
.house .plan *{fill:none;stroke:var(--cyan);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.house .built line,.house .built polyline,.house .built rect.f{stroke:var(--lumber);stroke-width:3;stroke-linecap:square;fill:none}
.house .built rect.slab{fill:#52697c;stroke:none}
.house .built rect.open{fill:var(--ink);stroke:var(--lumber);stroke-width:3}
.house .built .lit{fill:var(--pencil);opacity:0;transition:opacity 1.2s .8s}
.house.done .built .lit{opacity:.9}
.house .built .siding{fill:#173f5e;stroke:none;opacity:0;transition:opacity 1.2s}
.house.done .built .siding{opacity:1}
#reveal-rect{transition:transform 2.2s cubic-bezier(.22,.7,.2,1)}
.house text{font:italic 400 14px var(--fb);fill:var(--dim)}
.house .dim{stroke:var(--cyan);stroke-width:1;opacity:.75}
.next{display:flex;gap:14px;align-items:center;background:var(--plan);border:1px solid var(--line);border-left:6px solid var(--pencil);padding:14px 16px;margin:12px 0 6px}
.next .k{font:600 16px var(--fd);letter-spacing:.03em;color:var(--cyan)}
.next .t{font:800 24px/1.05 var(--fd)}
.stagehd{margin:38px 0 2px}
.stagenote{color:var(--dim);font-size:16px;margin:0 0 14px;max-width:44ch}
.unitrow{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:6px 8px 14px 0;cursor:pointer}
.unitrow:not(.last)::before{content:'';position:absolute;left:21px;top:50px;bottom:-4px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 16px)}
.unitrow .node{position:relative;width:44px;height:44px;border:1.5px solid var(--cyan);background:var(--plan);display:grid;place-items:center;font:800 24px var(--fd);overflow:hidden}
.unitrow .node i{position:absolute;left:0;right:0;bottom:0;background:rgba(217,164,65,.62)}
.unitrow .node span{position:relative;text-shadow:0 1px 3px rgba(7,19,30,.9)}
.unitrow.full .node{border-color:var(--lumber)}.unitrow.full .node i{background:var(--lumber)}.unitrow.full .node span{color:#1b1500;text-shadow:none}
.unitrow:hover .ut{color:var(--pencil)}
.unitrow .ut{font:800 25px/1.05 var(--fd);letter-spacing:.005em;transition:color .15s}
.unitrow .us{font-size:15px;color:var(--faint);margin-top:2px;line-height:1.35}

@media (prefers-reduced-motion:reduce){#reveal-rect,.house .built .lit,.house .built .sold{transition:none}.stamp.pop{animation:none}.btn,.card.click,.opt{transition:none}}
code,.sym,.opt.mono{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
</style>

<script>
const DATA = {"units": [{"id": "N1", "part": "National", "title": "Property Ownership, Estates & Interests", "objectives": ["Distinguish real property, personal property and fixtures", "List the bundle of rights and the estates in land", "Compare forms of co-ownership and common-interest ownership", "Identify easements, liens, encroachments and other encumbrances"], "lessons": [{"title": "Real vs. personal property; fixtures", "body": ["**Land** is the earth's surface down to the center and up into the sky, including natural attachments (trees, minerals, water). **Real estate** is land plus man-made improvements permanently attached. **Real property** is real estate plus the *rights* of ownership (the bundle of rights). **Personal property** (chattel) is movable and not attached.", "A **fixture** is personal property that has been attached to land or a building so that it is legally real property. Courts apply the tests that spell **MARIA**:", "- **M**ethod of attachment (nailed, cemented, plumbed in = fixture)", "- **A**daptation to the real estate (custom-fit items)", "- **R**elationship of the parties (owner vs. tenant; buyer vs. seller)", "- **I**ntention of the person who attached it", "- **A**greement between the parties (the strongest evidence, if in writing)", "**Trade fixtures** (a restaurant's equipment, a salon's chairs) are installed by a tenant for business and remain the tenant's personal property; the tenant must remove them before the lease ends and repair damage. **Emblements** (fructus industriales) are annual crops produced by cultivation; a tenant farmer generally keeps the right to harvest them even if the lease ends. Naturally growing plants (fructus naturales) go with the land."], "key": ["Fixtures are treated as real property and pass with the sale unless excluded in writing", "Agreement of the parties is the strongest test; get items listed in the contract", "Trade fixtures belong to the tenant; emblements belong to the farmer-tenant"], "example": "A buyer assumes the chandelier conveys. The seller removes it before closing. Because the chandelier was hard-wired (method of attachment) and the contract did not exclude it, it is a fixture and the buyer can insist it stay. The fix: list 'chandelier in dining room EXCLUDED' in the contract.", "confirm": []}, {"title": "The bundle of rights and estates in land", "body": ["Owning real property gives a bundle of rights: **possession, control, enjoyment, exclusion, and disposition**. These can be separated (leased, mortgaged, given as easements).", "An **estate** is the degree, quantity, nature and extent of interest a person has in land. Estates are either **freehold** (of indefinite duration) or **leasehold** (a fixed or periodic term).", "**Freehold estates**", "- **Fee simple absolute** — the highest, most complete form; inheritable, no limit on time.", "- **Fee simple defeasible** (determinable or on condition subsequent) — ownership can end if a condition is violated; reverts automatically (determinable) or only if the grantor acts (condition subsequent).", "- **Life estate** — ownership measured by a person's life (their own or another's, *pur autre vie*). The **remainderman** takes at the end; if the grantor keeps the future interest it is a **reversion**.", "**Leasehold estates**: estate for years (fixed term), periodic tenancy (renews automatically), estate at will (no set term), estate at sufferance (holdover without consent).", "A leasehold is **personal property**, not real property, even though it is an interest in land. A freehold is real property."], "key": ["Fee simple absolute = most complete ownership", "Life estate holder cannot will the property away; remainderman/reversioner takes at death", "Leaseholds are personal property in most state classifications"], "example": "Maria deeds a lake cottage 'to my son Dan for his life, then to my daughter Eve.' Dan holds a life estate; Eve holds a remainder. Dan can use or lease the cottage but only until he dies; he cannot sell more than he owns.", "confirm": []}, {"title": "Forms of ownership", "body": ["**Ownership in severalty** — a single owner.", "**Tenancy in common** — two or more owners, undivided interests that may be unequal; each can sell, mortgage or will their share; **no right of survivorship**; unity of possession only. If a deed to several people does not say how title is held, many states presume tenancy in common.", "**Joint tenancy** — equal undivided interests with **right of survivorship**. Requires the four unities: **time, title, interest, possession** (T-T-I-P). Selling or transferring one's share *severs* the joint tenancy for that share, converting it to a tenancy in common for the buyer.", "**Tenancy by the entirety** — only for married couples in states that recognize it; survivorship; neither spouse can convey alone; creditors of just one spouse generally cannot reach it. **Community property** exists in nine states (not Mississippi).", "**Trusts, partnerships, corporations, LLCs** also hold title. A **land trust** keeps the owner's identity private.", "**Common-interest ownership**:", "- **Condominium** — separate fee ownership of an airspace unit plus an undivided interest in common elements; each owner gets a separate tax bill and mortgage.", "- **Cooperative** — a corporation owns the building; residents hold shares of stock plus a proprietary lease (generally treated as personal property).", "- **Planned unit development (PUD)** / **HOA** — owners hold fee title to lots with common areas run by an association; covenants and assessments run with the land.", "- **Timeshare** — interval ownership of use rights for periods each year."], "key": ["Joint tenancy needs T-T-I-P and survivorship", "Condo = real property unit; co-op = shares + proprietary lease", "Check the deed language: survivorship must be express"], "example": "Three friends buy property as joint tenants. One sells her third to a stranger. The stranger becomes a tenant in common as to that third; the other two remain joint tenants with each other (survivorship between them only).", "confirm": []}, {"title": "Encumbrances: liens, easements, encroachments, restrictions", "body": ["An **encumbrance** is any claim, lien, restriction or condition that affects title or use. Some affect ownership value; some affect only use.", "**Liens** are money claims against property. *Voluntary* liens: mortgage/deed of trust. *Involuntary*: judgment, tax, mechanic's, IRS, special assessment. **Priority** is generally 'first in time, first in right,' but **real property tax liens and special assessments** take priority over almost everything regardless of date. A **mechanic's lien** can often relate back to when work began (state-specific).", "**Easements** give a non-owner the right to use land for a limited purpose. An **appurtenant** easement benefits a neighboring parcel (dominant tenement) and burdens another (servient tenement) and runs with the land. An **easement in gross** benefits a person or company (utilities). **Creation**: express grant/reservation, implication, necessity, **prescription** (open, notorious, hostile, continuous use for the statutory period). An easement ends by merger, release, abandonment, necessity ending, or (for prescriptive) non-use as provided by law.", "A **license** is permission to enter, revocable, personal, and not an interest in land.", "**Encroachment** — a structure intrudes on a neighbor's land. A survey finds it. **Deed restrictions/covenants (CC&Rs)** limit use and run with the land; violations are enforced by injunction or damages; **zoning** (public) beats looser private covenants but a stricter covenant still applies.", "**Water rights**: *riparian* rights belong to owners of land bordering flowing water; *littoral* rights belong to owners bordering lakes/seas/oceans. *Prior appropriation* is used in the arid West. **Accretion** (gradual addition by water), **erosion**, **avulsion** (sudden loss) and **reliction** (water recedes) change boundaries differently — accretion and reliction add to the owner; avulsion does not change the boundary."], "key": ["Taxes and assessments get priority over earlier mortgages", "Easement appurtenant runs with the land; in gross does not benefit a parcel", "Prescription requires open, notorious, hostile, continuous use"], "example": "A utility pipeline crosses a farm under a recorded easement in gross. The farm is sold. The new owner takes subject to the easement because it is recorded and burdens the land.", "confirm": []}], "quiz": [{"id": "N1-1", "q": "A chandelier hard-wired into a dining room ceiling is most likely a:", "o": ["fixture", "trade fixture", "emblement", "chattel"], "a": 0, "why": "Method of attachment makes it a fixture unless the contract excludes it."}, {"id": "N1-2", "q": "The strongest evidence of whether an item is a fixture is the:", "o": ["written agreement of the parties", "cost of the item", "age of the item", "color match"], "a": 0, "why": "A written agreement overrides most other fixture tests."}, {"id": "N1-3", "q": "Which estate lasts for the lifetime of a person?", "o": ["life estate", "estate for years", "fee simple absolute", "estate at will"], "a": 0, "why": "A life estate is measured by a life."}, {"id": "N1-4", "q": "Right of survivorship is characteristic of:", "o": ["joint tenancy", "tenancy in common", "severalty", "a periodic tenancy"], "a": 0, "why": "Joint tenants' shares pass automatically to surviving owners."}, {"id": "N1-5", "q": "The four unities required for a joint tenancy are:", "o": ["time, title, interest, possession", "time, tenure, intent, price", "title, taxes, interest, possession", "time, title, income, partition"], "a": 0, "why": "T-T-I-P."}, {"id": "N1-6", "q": "A tenant installs display cases to run a shop. At lease end they are:", "o": ["the tenant's trade fixtures and removable", "the landlord's real property", "emblements", "fixtures that must stay"], "a": 0, "why": "Trade fixtures remain the tenant's property if removed on time."}, {"id": "N1-7", "q": "Which lien would generally have priority over a mortgage recorded years earlier?", "o": ["unpaid real property taxes", "a judgment lien", "a mechanic's lien filed last week", "a homeowner association's voluntary pledge"], "a": 0, "why": "Tax liens and special assessments have super-priority."}, {"id": "N1-8", "q": "A neighbor uses a path openly, continuously and without permission for the full statutory period. They may gain:", "o": ["an easement by prescription", "a license", "an easement in gross by grant", "a life estate"], "a": 0, "why": "Prescriptive easement from adverse use."}, {"id": "N1-9", "q": "An owner of a condominium unit holds:", "o": ["fee title to the unit and an undivided interest in common elements", "shares of stock and a proprietary lease", "a leasehold only", "an easement in gross"], "a": 0, "why": "That distinguishes condos from co-ops."}, {"id": "N1-10", "q": "Riparian rights belong to owners of land bordering:", "o": ["a flowing stream or river", "an ocean", "any public road", "a lake only"], "a": 0, "why": "Littoral applies to still water/oceans."}, {"id": "N1-11", "q": "A gradual build-up of soil by water deposit is:", "o": ["accretion", "avulsion", "erosion", "reliction"], "a": 0, "why": "Accretion adds to the owner's land."}, {"id": "N1-12", "q": "Revocable permission to enter someone's land is a:", "o": ["license", "easement", "lien", "encroachment"], "a": 0, "why": "A license is personal and revocable."}, {"id": "N1-13", "q": "Tenancy by the entirety is limited to:", "o": ["married couples where recognized", "any two relatives", "business partners", "three or more owners"], "a": 0, "why": "Needs marital unity."}, {"id": "N1-14", "q": "An estate that ends if a stated condition is violated is a:", "o": ["fee simple defeasible", "fee simple absolute", "life estate pur autre vie", "leasehold"], "a": 0, "why": "Defeasible fee can terminate."}, {"id": "N1-15", "q": "A leasehold estate is generally classified as:", "o": ["personal property", "real property", "a freehold", "a fee"], "a": 0, "why": "Leaseholds are personal property."}, {"id": "N1-16", "q": "Annual crops produced by cultivation are:", "o": ["emblements", "fructus naturales", "trade fixtures", "reliction"], "a": 0, "why": "Emblements stay with the farmer-tenant."}], "drill": false}, {"id": "N2", "part": "National", "title": "Land Use Controls, Descriptions & Environmental Issues", "objectives": ["Explain police power, zoning and nonconforming use", "Read the three legal description systems", "Identify key environmental hazards and disclosure duties"], "lessons": [{"title": "Public controls: police power, zoning, building codes", "body": ["Government controls land use through four powers: **police power** (health, safety, morals, general welfare), **eminent domain** (taking for public use with just compensation; *condemnation* is the process), **taxation**, and **escheat** (property reverts to the state when an owner dies without heirs or will).", "**Zoning** divides land into districts (residential, commercial, industrial, agricultural). It is an exercise of police power and requires no compensation. Related tools:", "- **Nonconforming use (grandfathering)** — a pre-existing use that no longer fits new zoning may continue, but generally can't be expanded or rebuilt after major destruction.", "- **Variance** — permission to deviate from a zoning rule due to hardship (e.g., setback).", "- **Special-use / conditional-use permit** — allowed use subject to conditions (a school in a residential zone).", "- **Rezoning** — change of district via legislative process; **spot zoning** (singling out one parcel for benefit) is generally illegal.", "- **Subdivision regulations**, **building codes**, **certificates of occupancy**, and **impact fees**.", "A **regulatory taking** can require compensation if regulation deprives the owner of essentially all economic use."], "key": ["Zoning = police power; eminent domain requires just compensation", "Nonconforming use can continue; variance is a deviation; spot zoning is illegal", "Escheat applies when there are no heirs"], "example": "A shop operating legally before a residential rezoning may continue as a nonconforming use but cannot double its floor area.", "confirm": []}, {"title": "Legal descriptions and surveys", "body": ["A legal description must identify the parcel uniquely. Street address is not a legal description. Three methods:", "- **Metes and bounds** — starts at a **point of beginning (POB)**, follows distances and compass bearings, and returns to the POB. Used in the original colonies, Texas, and elsewhere; can use monuments (trees, stakes, roads).", "- **Rectangular (government) survey system** — grid of **principal meridians** (north–south) and **base lines** (east–west). **Ranges** are 6-mile columns east/west of the meridian; **townships** are 6-mile rows north/south of the base line; a **township** = 6×6 miles = 36 sections. A **section** = 1 mile × 1 mile = **640 acres**; numbered 1–36 in a serpentine pattern starting at the NE corner (1) and ending at the SE corner (36). Quarter section = 160 acres; a 'N½ of the SE¼' is 80 acres.", "- **Lot, block and tract (recorded plat)** — refers to a recorded subdivision plat map; common in urban areas.", "Mississippi land was surveyed under the rectangular system from several principal meridians (for example Choctaw, Chickasaw, St. Stephens and Washington), so government-survey descriptions are common for rural parcels, while subdivisions use recorded plats.", "**Datum / benchmark** are elevation references. A **survey** shows boundaries, easements, encroachments and improvements. **Title insurance** commonly excepts matters a survey would show unless a survey is provided.", "**Calculating from a legal description**: read from the end backward. 'The W½ of the NE¼ of the SW¼' of a section: start at 640 → SW¼ = 160 → NE¼ of that = 40 → W½ = 20 acres."], "key": ["A section is 640 acres; a township is 36 sections", "Read government descriptions from the end backward", "A metes-and-bounds description must close at the POB"], "example": "How many acres is the S½ of the NW¼ of the SE¼ of Section 12? 640 ÷ 4 = 160 (SE¼); ÷ 4 = 40 (NW¼); ÷ 2 = 20 acres.", "confirm": []}, {"title": "Environmental issues and hazards", "body": ["Agents are **not experts** on environmental hazards but must disclose known material facts and recommend inspection by qualified professionals.", "- **Lead-based paint** — homes built before **1978**. Federal law requires sellers/landlords to give the *Protect Your Family from Lead in Your Home* pamphlet, disclose known lead hazards, provide available reports, and (for sales) give buyers **10 days** (unless otherwise agreed) to inspect. The contract carries a disclosure/acknowledgment. Penalties are significant; agents share responsibility.", "- **Asbestos** — fibers in old insulation, tile, pipe wrap; dangerous when friable/disturbed; encapsulation or professional abatement.", "- **Radon** — radioactive gas from soil; tested in picocuries per liter; EPA action level is **4 pCi/L**; mitigation with sub-slab depressurization.", "- **Mold** — moisture control is key; remediation by professionals.", "- **Underground storage tanks (USTs)**, **PCBs**, **urea-formaldehyde** insulation, **methamphetamine lab residue**, **Chinese drywall**, and **wetlands** (regulated by the Army Corps/state).", "- **CERCLA / Superfund** — strict, joint-and-several, retroactive liability for current and past owners and operators for contaminated sites; the **innocent landowner/bona fide prospective purchaser** defense depends on due diligence — a **Phase I Environmental Site Assessment** (records, history, site visit; no sampling). Phase II samples and tests.", "- **Flood**: FEMA flood zones; federally regulated lenders require flood insurance in Special Flood Hazard Areas (zones beginning with A or V). Details in the Gulf Coast unit."], "key": ["Pre-1978 housing → lead disclosure and 10-day inspection window", "EPA radon action level = 4 pCi/L", "CERCLA liability is strict, joint and several, and retroactive"], "example": "A 1965 house is listed. The listing agent must hand the buyer the lead pamphlet and the seller's disclosure before the buyer is obligated under the contract.", "confirm": []}], "quiz": [{"id": "N2-1", "q": "Zoning is an exercise of the government's:", "o": ["police power", "eminent domain", "escheat", "taxation"], "a": 0, "why": "Zoning regulates for public welfare."}, {"id": "N2-2", "q": "A pre-existing use that no longer matches new zoning is a:", "o": ["nonconforming use", "variance", "spot zoning", "special-use permit"], "a": 0, "why": "Grandfathered use."}, {"id": "N2-3", "q": "A deviation from zoning because of hardship is a:", "o": ["variance", "rezoning", "condemnation", "setback"], "a": 0, "why": "Variance."}, {"id": "N2-4", "q": "When an owner dies with no will and no heirs, the property:", "o": ["escheats to the state", "is condemned", "reverts to the county tax collector without process", "becomes a life estate"], "a": 0, "why": "Escheat."}, {"id": "N2-5", "q": "A section contains how many acres?", "o": ["640", "160", "320", "36"], "a": 0, "why": "1 mile × 1 mile."}, {"id": "N2-6", "q": "A township contains how many sections?", "o": ["36", "16", "640", "24"], "a": 0, "why": "6×6."}, {"id": "N2-7", "q": "How many acres in the N½ of the SW¼ of a section?", "o": ["80", "40", "160", "20"], "a": 0, "why": "160 ÷ 2 = 80."}, {"id": "N2-8", "q": "A metes-and-bounds description must:", "o": ["return to the point of beginning", "use only street names", "reference a plat", "end at a river"], "a": 0, "why": "It closes at the POB."}, {"id": "N2-9", "q": "Lead-based paint disclosure applies to housing built before:", "o": ["1978", "1968", "1988", "1950"], "a": 0, "why": "Federal rule."}, {"id": "N2-10", "q": "The EPA radon action level is:", "o": ["4 pCi/L", "10 pCi/L", "1 pCi/L", "40 pCi/L"], "a": 0, "why": "Action level."}, {"id": "N2-11", "q": "Superfund (CERCLA) liability is:", "o": ["strict, joint and several, and retroactive", "limited to current owners", "fault-based only", "prospective only"], "a": 0, "why": "Broad liability."}, {"id": "N2-12", "q": "A Phase I environmental assessment involves:", "o": ["records review and site inspection without sampling", "soil boring and lab testing", "remediation", "a title search only"], "a": 0, "why": "Phase II samples."}, {"id": "N2-13", "q": "A 'taking' of property for public use requires:", "o": ["just compensation", "no compensation", "only notice", "a variance"], "a": 0, "why": "Eminent domain."}, {"id": "N2-14", "q": "Spot zoning is generally:", "o": ["illegal", "required", "a variance", "a nonconforming use"], "a": 0, "why": "Unfair singling out of one parcel."}], "drill": false}, {"id": "N3", "part": "National", "title": "Agency, Brokerage & Ethical Duties", "objectives": ["Define agency relationships and fiduciary duties (OLD CAR)", "Distinguish seller, buyer, dual, designated agent and transaction broker", "Understand disclosure, creation and termination of agency", "Recognize broker compensation and Realtor® Code basics"], "lessons": [{"title": "Agency basics and fiduciary duties", "body": ["**Agency** is a fiduciary relationship in which a **principal** appoints an **agent** to act on their behalf in dealings with a **third party**. The broker is the agent of the principal; the broker's salespeople are the broker's sub-agents/associates. A **customer** is a third party who is not represented; a **client** is represented. A **general agent** has broad authority; a **special agent** (nearly all real estate agents) has authority for a specific transaction; a **universal agent** acts across all matters (power of attorney).", "**Agency creation**: express (written/oral), implied (conduct), ratification, estoppel. Written listing agreements are required to enforce a commission in most states, and Mississippi now requires a written brokerage agreement before listing or submitting an offer.", "**Fiduciary duties — OLD CAR**:", "- **O**bedience — follow lawful instructions", "- **L**oyalty — put the principal's interests first; no secret profit", "- **D**isclosure — tell the principal all material facts", "- **C**onfidentiality — keep the principal's confidential information (price flexibility, motives) even after the relationship ends", "- **A**ccounting — account for all money and documents", "- **R**easonable care and skill", "**Duties to all parties (including customers)**: honesty and fair dealing, disclosure of known material facts that affect value or desirability (**latent defects**), avoiding misrepresentation, compliance with fair housing and other laws. **Puffing** (opinion/exaggeration, e.g., 'best house on the block') is allowed; **misrepresentation** (false statement of material fact) is not. Negligent misrepresentation or fraud can create liability even if unintentional."], "key": ["OLD CAR = Obedience, Loyalty, Disclosure, Confidentiality, Accounting, Reasonable care", "Clients get fiduciary duties; customers get honesty and fair dealing", "Puffing is okay; misrepresentation is not"], "example": "A buyer's agent learns the buyer will pay $20,000 over list. Telling the listing agent would breach confidentiality and loyalty.", "confirm": []}, {"title": "Types of brokerage relationships", "body": ["- **Seller's (listing) agent** represents the seller; the buyer is a customer.", "- **Buyer's agent** represents the buyer; may be paid by the seller via cooperating-broker compensation or by the buyer, as agreed in writing.", "- **Dual agency** — one broker (or agent) represents both buyer and seller in the same transaction. Requires **informed written consent** from both. Fiduciary duties are limited: the dual agent cannot advocate for either on price or reveal confidential bargaining information.", "- **Designated agency** — the broker designates one affiliated agent for the seller and another for the buyer; each is fiduciary to their own client while the broker supervises both.", "- **Transaction broker / facilitator** (non-agent) — assists both parties without fiduciary duties; owes limited duties (honesty, accounting, disclosure of material facts). Recognized in many states; **Mississippi's treatment is covered in the state unit**.", "- **Subagency** — a broker cooperating with a listing broker, owing fiduciary duties to the listing principal; now less common because of buyer-agency. Listing agents may not offer subagency without the seller's authorization.", "**Disclosure**: agency disclosure must be made at first substantive contact with a prospective buyer or seller, before confidential information is shared.", "**Undisclosed dual agency** is a serious violation; commissions can be forfeited and the license disciplined."], "key": ["Dual agency requires informed written consent", "Designated agent keeps each client's confidences within the same brokerage", "Disclose agency at first substantive contact"], "example": "A salesperson at ABC Realty listed a house; a different ABC salesperson brings a buyer. ABC can use designated agency (if allowed) so each salesperson advocates for their own client.", "confirm": []}, {"title": "Listing agreements, compensation, termination", "body": ["**Listing types**:", "- **Open listing** — non-exclusive; seller can list with many brokers and only the broker who procures the buyer is paid; the seller who sells on their own owes no commission.", "- **Exclusive agency** — one broker, but the seller keeps the right to sell on their own without commission.", "- **Exclusive right to sell** — the broker is paid if *anyone* (including the owner) sells during the term; the most protective for the broker and the most common.", "- **Net listing** — the seller receives a net amount; the broker keeps the excess. Considered a conflict of interest and prohibited or discouraged in many states; if used, requires full disclosure.", "- **Multiple listing service (MLS)** — cooperative marketing network; a broker listing is entered and cooperating brokers receive an offer of compensation (terms changed under 2024 NAR settlement practices: offers of compensation are no longer displayed on the MLS, and written buyer-broker agreements are required before touring a home in many markets).", "**Elements of a valid listing**: competent parties, legal description or address, price and terms, commission, definite start and end date, owner signature(s), broker authority. A **definite expiration date** is required in most states; automatic renewals are disfavored.", "**Procuring cause**: the broker whose efforts started an unbroken chain of events leading to the sale generally earns the commission. A **protection (safety/extender) clause** pays the listing broker a commission if the seller sells within a period after expiration to a buyer the broker introduced.", "**Termination of agency**: expiration, completion, mutual agreement, revocation by the principal (may owe commission), renunciation by the agent, death/incapacity of the principal or agent, bankruptcy, destruction of the property, and breach. Revoking an exclusive listing can expose the seller to damages.", "**Commissions are negotiable** — never set by law; any agreement among brokers on rates is **price fixing** (Sherman Act). Also illegal: **group boycott** and **market allocation** (dividing territories or customers)."], "key": ["Exclusive right to sell pays the broker even if the owner sells", "Commissions are negotiable; price fixing violates antitrust law", "Listing needs a definite expiration date"], "example": "A seller on an exclusive agency listing finds her own buyer. She owes no commission; if she had signed an exclusive right to sell, she would.", "confirm": []}], "quiz": [{"id": "N3-1", "q": "Which duty means putting the principal's interests above all others?", "o": ["loyalty", "obedience", "accounting", "puffing"], "a": 0, "why": "Loyalty."}, {"id": "N3-2", "q": "Under OLD CAR, the 'C' stands for:", "o": ["confidentiality", "competence", "consent", "compensation"], "a": 0, "why": "Confidentiality."}, {"id": "N3-3", "q": "A client differs from a customer in that the client:", "o": ["is represented by the agent", "pays no commission", "is always the buyer", "is the broker"], "a": 0, "why": "Clients get fiduciary duties."}, {"id": "N3-4", "q": "An exaggerated opinion such as 'the best view in town' is:", "o": ["puffing", "fraud", "latent defect", "misrepresentation"], "a": 0, "why": "Puffing is not actionable."}, {"id": "N3-5", "q": "Dual agency requires:", "o": ["informed written consent from both parties", "only the seller's consent", "no consent", "a variance"], "a": 0, "why": "Consent is mandatory."}, {"id": "N3-6", "q": "The listing type that pays a commission even when the owner finds the buyer is:", "o": ["exclusive right to sell", "open listing", "exclusive agency", "net listing"], "a": 0, "why": "Broker is protected."}, {"id": "N3-7", "q": "An open listing pays the commission to:", "o": ["the broker who procures the buyer", "all brokers equally", "the first broker named", "the MLS"], "a": 0, "why": "Procuring cause."}, {"id": "N3-8", "q": "A net listing is:", "o": ["viewed as a conflict of interest and restricted in many states", "the most common listing", "required by the MLS", "an exclusive agency"], "a": 0, "why": "Risk of hidden profit."}, {"id": "N3-9", "q": "Real estate commissions are set by:", "o": ["negotiation between the parties", "state law", "the MLS", "the local board"], "a": 0, "why": "Antitrust law forbids fixed rates."}, {"id": "N3-10", "q": "Brokers agreeing to divide up sales territories is:", "o": ["market allocation, an antitrust violation", "a lawful agreement", "a listing agreement", "subagency"], "a": 0, "why": "Sherman Act."}, {"id": "N3-11", "q": "An agent's authority limited to a particular transaction is a:", "o": ["special agency", "general agency", "universal agency", "implied agency"], "a": 0, "why": "Real estate agents are special agents."}, {"id": "N3-12", "q": "A protection clause protects:", "o": ["the broker's commission after the listing expires", "the buyer's deposit", "the seller's equity", "the lender"], "a": 0, "why": "Extender clause."}, {"id": "N3-13", "q": "Agency disclosure should be made:", "o": ["at first substantive contact", "at closing", "after the offer", "when requested"], "a": 0, "why": "Before confidential information is shared."}, {"id": "N3-14", "q": "A transaction broker generally:", "o": ["owes limited duties and no fiduciary duties", "is a fiduciary to both", "represents only the seller", "is a subagent"], "a": 0, "why": "Facilitator."}, {"id": "N3-15", "q": "The agency relationship ends automatically upon:", "o": ["death of the principal", "a price reduction", "an open house", "an offer"], "a": 0, "why": "Death/incapacity of principal."}], "drill": false}, {"id": "N4", "part": "National", "title": "Valuation, Appraisal & Investment Analysis", "objectives": ["Distinguish price, cost and value", "Apply the three approaches to value", "Recognize appraisal principles and regulations", "Do basic income-property analysis"], "lessons": [{"title": "Value concepts and principles", "body": ["**Value** is the present worth of future benefits. **Market value** is the most probable price a property should bring in a competitive, open market with a willing, informed buyer and seller, neither under duress, reasonable exposure time, and payment in cash or equivalent. **Price** is what was actually paid. **Cost** is the expense of production. **Assessed value** is for taxes; **insurable value** excludes land.", "Four elements of value (**DUST**): **D**emand, **U**tility, **S**carcity, **T**ransferability. Value principles: **highest and best use** (legally permissible, physically possible, financially feasible, maximally productive), **substitution** (a buyer won't pay more than the cost of an equal substitute), **supply and demand**, **conformity**, **progression** (a lesser property gains value near better ones), **regression** (a better property loses value near lesser ones), **contribution**, **anticipation**, **change**, **balance**, **competition**.", "**Depreciation** is loss in value from any cause. **Physical deterioration** (curable or incurable), **functional obsolescence** (design defects such as outdated floor plan; curable/incurable), **external (economic) obsolescence** (outside the property, e.g., nearby landfill; **always incurable**). **Curable** means the cost to cure is less than the value added."], "key": ["DUST: Demand, Utility, Scarcity, Transferability", "External obsolescence is always incurable", "Highest and best use: legal, possible, feasible, most productive"], "example": "A beautiful house next to a new rendering plant loses value for a reason outside the lot — external obsolescence — and the owner cannot cure it.", "confirm": []}, {"title": "The three approaches to value", "body": ["**1. Sales comparison (market data) approach** — best for single-family homes and vacant land. Select **comparables** (recent, nearby, similar sales), then **adjust the comparable to match the subject**: if the comp is *better*, **subtract**; if the comp is *worse*, **add**. Never adjust the subject. Adjust for time, location, physical features, terms of sale. Adjust the price of the comp, not the subject's.", "**2. Cost approach** — best for new, special-purpose or unique buildings (schools, churches). **Value = reproduction or replacement cost of improvements − accumulated depreciation + land value**. **Reproduction cost** replicates the exact building; **replacement cost** uses modern equivalents. Land is valued by sales comparison. Methods: square-foot, unit-in-place, quantity survey.", "**3. Income approach** — best for investment property. **Value = Net Operating Income ÷ Capitalization Rate**.", "- Potential gross income (PGI) − vacancy and collection loss = Effective gross income (EGI)", "- EGI − operating expenses = **NOI**. Operating expenses include taxes, insurance, maintenance, management, utilities, reserves. **Not** included: mortgage payments (debt service), income taxes, depreciation, capital improvements.", "- **Gross rent multiplier (GRM)** = price ÷ monthly gross rent (for small residential rentals); **gross income multiplier (GIM)** uses annual income.", "**Reconciliation** weighs the approaches to reach a final opinion; the appraiser gives the most weight to the approach with the best data for that property type. **CMA vs appraisal**: a broker price opinion/CMA is not an appraisal; only licensed/certified appraisers may do appraisals for federally related transactions. Appraiser independence rules (post-2008 **Dodd-Frank**/AMCs) prohibit pressure on appraisers; agents must not influence value."], "key": ["Comp better than subject → subtract; comp worse → add", "Value = NOI ÷ cap rate", "Cost approach: replacement cost − depreciation + land"], "example": "Subject has no garage. A comp with a garage worth $12,000 sold for $250,000. Adjusted comp = $238,000.", "confirm": []}, {"title": "Investment basics and appraisal regulation", "body": ["Key investment measures: **cash flow** (NOI − debt service), **cap rate** = NOI ÷ value, **ROI** = annual return ÷ investment, **cash-on-cash return** = annual pre-tax cash flow ÷ cash invested, **loan-to-value (LTV)**, **debt service coverage ratio (DSCR)** = NOI ÷ annual debt service (lenders usually want ≥ 1.2).", "**Leverage** is using borrowed money to magnify returns (and losses). **Appreciation** is value increase; **depreciation (tax)** is a non-cash expense that shelters income for investors (residential 27.5 years, commercial 39 years straight line). **1031 exchange** defers capital gain when like-kind investment real property is swapped within strict timelines (45 days to identify, 180 days to close).", "**Appraisal regulation**: Title XI of FIRREA requires appraisers to be state-licensed or certified for federally related transactions; USPAP sets standards; the Appraisal Subcommittee oversees. In Mississippi, appraisers are licensed and certified by a separate state appraiser board, not by licensing as a real estate salesperson or broker; confirm the current agency with the state.", "**Home inspection** and **appraisal** have different purposes: an inspection evaluates condition; an appraisal estimates value for the lender."], "key": ["DSCR = NOI ÷ debt service", "1031: identify 45 days, close 180 days", "Appraisers are regulated separately from real estate licensees"], "example": "NOI $60,000; debt service $48,000 → DSCR 1.25, acceptable to most lenders.", "confirm": []}], "quiz": [{"id": "N4-1", "q": "Value = NOI ÷ cap rate is the:", "o": ["income approach", "cost approach", "sales comparison approach", "GRM approach"], "a": 0, "why": "Direct capitalization."}, {"id": "N4-2", "q": "If a comparable is superior to the subject, the appraiser should:", "o": ["subtract the feature's value from the comparable's price", "add to the comparable", "adjust the subject", "ignore it"], "a": 0, "why": "Make the comp like the subject."}, {"id": "N4-3", "q": "Which depreciation is always incurable?", "o": ["external obsolescence", "physical deterioration", "functional obsolescence", "deferred maintenance"], "a": 0, "why": "Outside the property."}, {"id": "N4-4", "q": "The best approach for a new church is the:", "o": ["cost approach", "income approach", "sales comparison approach", "GRM"], "a": 0, "why": "Few comps for special-purpose."}, {"id": "N4-5", "q": "Which is NOT deducted when computing NOI?", "o": ["mortgage payments", "property taxes", "insurance", "management fees"], "a": 0, "why": "Debt service is below NOI."}, {"id": "N4-6", "q": "DUST stands for demand, utility, scarcity and:", "o": ["transferability", "taxation", "tenure", "time"], "a": 0, "why": "Elements of value."}, {"id": "N4-7", "q": "The principle that a buyer won't pay more than the cost of an equally desirable substitute is:", "o": ["substitution", "conformity", "progression", "contribution"], "a": 0, "why": "Foundation of the sales comparison approach."}, {"id": "N4-8", "q": "A lesser property gains value from nearby better properties. This is:", "o": ["progression", "regression", "conformity", "anticipation"], "a": 0, "why": "Progression."}, {"id": "N4-9", "q": "Market value assumes:", "o": ["a willing, informed buyer and seller, neither under duress", "a quick forced sale", "related parties", "only cash sales"], "a": 0, "why": "Standard definition."}, {"id": "N4-10", "q": "Highest and best use must be legally permissible, physically possible, financially feasible and:", "o": ["maximally productive", "publicly approved", "newly built", "commercial"], "a": 0, "why": "Four tests."}, {"id": "N4-11", "q": "GRM is:", "o": ["price ÷ monthly gross rent", "NOI ÷ price", "annual rent ÷ expenses", "price ÷ NOI"], "a": 0, "why": "GRM."}, {"id": "N4-12", "q": "Depreciation for tax on residential rental property is generally:", "o": ["27.5 years", "15 years", "39 years", "50 years"], "a": 0, "why": "Commercial is 39."}, {"id": "N4-13", "q": "A 1031 exchange requires identifying replacement property within:", "o": ["45 days", "30 days", "90 days", "180 days"], "a": 0, "why": "Close within 180."}, {"id": "N4-14", "q": "A CMA prepared by a real estate agent:", "o": ["is not an appraisal", "can replace an appraisal for a federal loan", "requires USPAP certification", "is binding on the lender"], "a": 0, "why": "Agents give opinions, not appraisals."}], "drill": false}, {"id": "N5", "part": "National", "title": "Real Estate Finance", "objectives": ["Explain mortgage instruments, lien theory and deeds of trust", "Compare loan programs (conventional, FHA, VA, USDA)", "Apply RESPA/TILA/TRID, ECOA and lending rules", "Understand the primary and secondary markets"], "lessons": [{"title": "Financing instruments and mortgage basics", "body": ["Two documents: the **promissory note** (the debt; the borrower's promise to pay) and the **security instrument** (mortgage or **deed of trust**) which pledges the property. The note is the evidence of debt; the security instrument creates the lien.", "**Mortgage** (two parties: **mortgagor**=borrower, **mortgagee**=lender) is usually foreclosed judicially in most lien-theory states. **Deed of trust** (three parties: **trustor**=borrower, **beneficiary**=lender, **trustee**=neutral third party holding title for the lender) usually allows **non-judicial foreclosure** under a **power of sale**. Mississippi commonly uses deeds of trust with power of sale.", "Key clauses: **acceleration** (entire balance due on default), **due-on-sale** (alienation) clause, **defeasance** (mortgage void on payoff), **prepayment penalty**, **escrow** (impounds for taxes and insurance), **subordination** (changing lien priority).", "**Payment types**: **amortized** (principal + interest, fully pays off), **interest-only**, **balloon**, **adjustable-rate (ARM)** with index + margin, caps and adjustment periods, **graduated payment**, **reverse mortgage** (HECM, FHA-insured, borrower 62+, loan due when the borrower leaves/dies).", "**Interest** accrues on the unpaid balance; in the early years of a fixed loan, most of the payment is interest. **Points**: one discount point = 1% of the loan, paid to lower the interest rate (a point buys about 1/8% reduction, varying). **Origination fee** pays the lender's processing. **PMI** (private mortgage insurance) is typically required when LTV exceeds 80% on a conventional loan and can be canceled at 80% (automatic termination at 78% under the Homeowners Protection Act).", "**Assumption** (buyer takes over the existing loan; seller stays secondarily liable unless released by novation), **'subject to'** (buyer takes title with the loan outstanding; seller remains liable), **wraparound** and **land contract (contract for deed / installment contract)** where the seller keeps legal title until payment — equitable title passes to the buyer immediately."], "key": ["Note = debt; mortgage/deed of trust = lien", "Deed of trust has three parties and allows power of sale", "PMI is generally required above 80% LTV on conventional loans"], "example": "A $200,000 loan at 3 points: points cost $6,000 (3% × $200,000).", "confirm": []}, {"title": "Loan programs and underwriting", "body": ["**Conventional loans** are not government-insured. **Conforming** loans meet Fannie Mae/Freddie Mac limits (set annually by FHFA); **jumbo** loans exceed them. Typical minimum down payment 3–5%; PMI if under 20%.", "**FHA** (Dept. of Housing and Urban Development): insures lender; minimum down payment 3.5% with 580+ credit score (10% for 500–579); requires an **upfront MIP** and **annual MIP**; property standards; assumable (subject to rules).", "**VA**: guaranteed (not insured) by the Dept. of Veterans Affairs for eligible veterans, service members, and some surviving spouses; **no down payment** generally required and no monthly PMI; a **funding fee** applies (waived for some); **Certificate of Eligibility (COE)**; the VA Notice of Value (NOV) sets value.", "**USDA Rural Development (Section 502)**: for eligible rural areas and income limits; 100% financing possible.", "**Underwriting** evaluates the **4 Cs**: credit, capacity, collateral, capital. Ratios: **front-end (housing) ratio** = PITI ÷ gross monthly income; **back-end (total debt) ratio** = (PITI + other debts) ÷ gross monthly income. Typical conventional guidelines: ~28/36 historically; modern automated underwriting allows higher (FHA up to ~31/43 or more with compensating factors). **PITI** = principal, interest, taxes, insurance. **LTV** = loan ÷ lesser of price or appraised value.", "**Qualified Mortgage (QM)** rules under the **Ability-to-Repay** rule limit risky features and generally cap points and fees.", "**Seller concessions**, **buydowns**, and **seller financing** (purchase-money mortgage) are negotiated in the contract; lenders cap concessions."], "key": ["FHA: 3.5% down at 580+; VA: no down payment, guaranteed; USDA: rural", "Front-end ratio = PITI ÷ gross income; back-end adds all other debts", "LTV uses the lesser of price or appraised value"], "example": "Price $250,000, appraisal $240,000, loan $228,000 → LTV = 228,000 ÷ 240,000 = 95%.", "confirm": []}, {"title": "Federal lending laws and the mortgage markets", "body": ["- **TILA / Regulation Z** — disclosure of credit terms (APR, finance charge, amount financed, total payments). **Advertising triggers**: stating a *triggering term* (down payment amount, payment amount, number of payments, finance charge or **interest rate in monetary terms**) requires full disclosure of the loan's APR, terms and repayment schedule. A statement like 'Easy terms' or 'Low down payment' is non-triggering; 'Only $1,000 down' is triggering.", "- **RESPA / Regulation X** — applies to federally related loans on 1–4 family residential; requires settlement-cost disclosures; **prohibits kickbacks and referral fees** (Section 8) and limits escrow cushions (generally two months). Affiliated business arrangements require disclosure.", "- **TRID (TILA-RESPA Integrated Disclosure)** — the **Loan Estimate** within **3 business days** of application and the **Closing Disclosure** at least **3 business days** before consummation. A **3-business-day right of rescission** applies to refinancing of a primary residence and home-equity loans (not purchase loans).", "- **ECOA** — prohibits credit discrimination on race, color, religion, national origin, sex, marital status, age (if of legal capacity), receipt of public assistance, or exercise of consumer-credit rights; **adverse-action notice** within 30 days.", "- **Fair Credit Reporting Act**, **Homeowners Protection Act** (PMI cancellation), **Equal Credit**, **HMDA** (mortgage data to monitor lending patterns), **redlining** is illegal.", "**Primary market** — originators (banks, credit unions, mortgage bankers/brokers) lend to borrowers. **Secondary market** — Fannie Mae, Freddie Mac (GSEs), **Ginnie Mae** (government-owned; guarantees securities backed by FHA/VA/USDA loans) buy/pool loans into **mortgage-backed securities** to supply liquidity. **Federal Reserve** controls monetary policy (discount rate, reserve requirements, open-market operations).", "**Mortgage loan originator** licensing falls under the **SAFE Act/NMLS**; real estate licensees can't originate loans without proper licensing, and can't steer."], "key": ["Loan Estimate: 3 business days after application; Closing Disclosure: 3 business days before closing", "RESPA bans kickbacks for settlement-service referrals", "Ginnie Mae guarantees securities backed by FHA/VA loans"], "example": "Ad says 'Only 3% down, $1,200/month.' Both are triggering terms; the ad must include APR, term and repayment details.", "confirm": []}], "quiz": [{"id": "N5-1", "q": "The promissory note is:", "o": ["evidence of the debt", "the lien itself", "the deed", "a covenant"], "a": 0, "why": "The security instrument creates the lien."}, {"id": "N5-2", "q": "In a deed of trust, the neutral third party is the:", "o": ["trustee", "trustor", "beneficiary", "mortgagee"], "a": 0, "why": "Trustee holds title for security."}, {"id": "N5-3", "q": "The clause that makes the entire balance due on default is:", "o": ["acceleration", "defeasance", "subordination", "alienation"], "a": 0, "why": "Acceleration."}, {"id": "N5-4", "q": "One discount point on a $300,000 loan costs:", "o": ["$3,000", "$300", "$30,000", "$1,500"], "a": 0, "why": "1% × 300,000."}, {"id": "N5-5", "q": "PMI on a conventional loan is generally required when LTV exceeds:", "o": ["80%", "70%", "90%", "95%"], "a": 0, "why": "Under 20% down."}, {"id": "N5-6", "q": "VA loans are:", "o": ["guaranteed by the VA", "insured by the VA", "insured by FHA", "made by Fannie Mae"], "a": 0, "why": "VA guarantees; FHA insures."}, {"id": "N5-7", "q": "Minimum FHA down payment with a 580+ credit score:", "o": ["3.5%", "0%", "5%", "10%"], "a": 0, "why": "3.5%."}, {"id": "N5-8", "q": "LTV on a $250,000 sale with $240,000 appraisal and $228,000 loan is:", "o": ["95%", "91.2%", "92%", "100%"], "a": 0, "why": "228/240."}, {"id": "N5-9", "q": "Back-end ratio includes:", "o": ["PITI plus all other monthly debts", "only PITI", "only taxes", "only car payments"], "a": 0, "why": "Total debt ratio."}, {"id": "N5-10", "q": "An ad saying 'Only $2,000 down!' triggers:", "o": ["full TILA disclosures", "no disclosure", "only RESPA disclosure", "only state law"], "a": 0, "why": "Down payment is a triggering term."}, {"id": "N5-11", "q": "The Loan Estimate must be delivered within:", "o": ["3 business days of application", "1 day", "10 days", "at closing"], "a": 0, "why": "TRID."}, {"id": "N5-12", "q": "The Closing Disclosure must be received at least:", "o": ["3 business days before closing", "24 hours before", "at closing", "7 days before"], "a": 0, "why": "TRID."}, {"id": "N5-13", "q": "RESPA Section 8 prohibits:", "o": ["kickbacks for referrals of settlement services", "points", "escrow accounts", "appraisals"], "a": 0, "why": "No referral fees."}, {"id": "N5-14", "q": "Ginnie Mae:", "o": ["guarantees securities backed by FHA/VA/USDA loans", "is a private lender", "sets the discount rate", "insures conventional loans"], "a": 0, "why": "Government-owned."}, {"id": "N5-15", "q": "ECOA prohibits credit discrimination based on:", "o": ["marital status", "credit history", "income", "debts"], "a": 0, "why": "Protected bases."}, {"id": "N5-16", "q": "In a land contract, legal title passes:", "o": ["when the contract is fully paid", "at signing", "at inspection", "at the first payment"], "a": 0, "why": "Equitable title passes first."}], "drill": false}, {"id": "N6", "part": "National", "title": "Contracts", "objectives": ["List the elements of a valid contract", "Classify contracts by status and enforceability", "Apply the statute of frauds and key contract provisions", "Explain default, remedies and discharge"], "lessons": [{"title": "Elements and classification", "body": ["A valid contract has **(1) competent parties, (2) mutual consent (offer and acceptance, 'meeting of the minds'), (3) lawful object, (4) consideration, and (5) in writing when required (statute of frauds)**. Memory aid: **COLA**, with a writing for real estate: Competent parties, Offer and acceptance, Legal purpose, Adequate consideration (plus writing).", "**Competency**: minors, persons declared mentally incompetent, and persons intoxicated may lack capacity; contracts by minors are generally **voidable** at the minor's option.", "**Consent defects**: fraud, misrepresentation, mistake, duress, undue influence make a contract **voidable**.", "**Classification**:", "- **Express** (stated) vs **implied** (by conduct)", "- **Bilateral** (promise for promise—most real estate contracts) vs **unilateral** (promise for an act—an open listing or option)", "- **Executory** (not fully performed) vs **executed** (fully performed)", "- **Valid**, **void** (no legal effect), **voidable** (one party may cancel), **unenforceable** (valid but cannot be enforced in court, e.g., oral contract for land)", "**Offer**: terminated by acceptance, rejection, **counteroffer** (a counteroffer rejects the original), revocation before acceptance, lapse of time, death or incapacity. An **acceptance** must mirror the offer and be communicated.", "**Consideration**: something of value (money, promise, act). Love and affection ('good consideration') supports a deed but not typically a contract. **Statute of frauds** — contracts to sell, convey or lease real property for more than one year must be in writing and signed by the party to be charged. Mississippi follows the statute of frauds. An agent's authority to sell must also be in writing."], "key": ["Real estate contracts for sale must be written and signed", "Counteroffer = rejection of the original offer", "Voidable vs void vs unenforceable"], "example": "Seller says yes to the price but changes the closing date in writing. That is a counteroffer; the buyer's original offer is dead and can't be accepted later.", "confirm": []}, {"title": "Purchase contract provisions and contingencies", "body": ["A **purchase and sale agreement** typically includes: parties, legal description, price, **earnest money**, financing terms, contingencies, closing date, possession, prorations, title evidence, personal property included, default remedies, and disclosures.", "**Earnest money** is a good-faith deposit; it is not required for validity but shows the buyer's seriousness. It is held in the broker's **trust (escrow) account**; the broker may never commingle it or use it. If the parties dispute it, the broker typically holds the funds until a written release, or interpleader/court order.", "**Contingencies** make performance depend on an event: financing, appraisal, inspection, sale of buyer's current home, title. Each should have a **deadline** and a defined remedy (cancel, renegotiate, waive). **Time is of the essence** makes deadlines strict.", "**Equitable title** — buyer's interest between contract and closing. **Doctrine of equitable conversion**. **Risk of loss** before closing is allocated by contract; the Uniform Vendor and Purchaser Risk Act places it on the seller until title or possession passes (state-specific).", "**Option** — buyer pays for the right (not the obligation) to buy within a time; unilateral; the optionor must honor it; the optionee can walk away and lose the option fee. **Right of first refusal** gives a person the first chance to match an offer. **Assignment** transfers contract rights; **novation** substitutes a new party and releases the original.", "**Lease-purchase** (lease-option) combines lease and option.", "**Default and remedies**: if the buyer defaults — seller may keep earnest money (if liquidated damages), sue for damages, or sue for **specific performance** (court orders the sale; real property is unique). If the seller defaults — buyer may sue for specific performance, damages, or rescission and return of deposit. **Rescission** returns parties to their original positions. **Liquidated damages** pre-agree on damages. **Contract discharge**: full performance, mutual agreement, impossibility, operation of law, breach, statute of limitations."], "key": ["Specific performance is the buyer's usual remedy against a seller", "Liquidated damages: pre-agreed amount, often the earnest money", "Options are unilateral contracts"], "example": "A buyer's financing contingency expires Friday. If the buyer neither waives nor cancels in writing by then, the contract may proceed with the contingency lost, depending on the contract's terms.", "confirm": []}], "quiz": [{"id": "N6-1", "q": "Which is NOT an essential element of a valid contract?", "o": ["earnest money", "competent parties", "consideration", "legal purpose"], "a": 0, "why": "Earnest money is common but not required."}, {"id": "N6-2", "q": "A contract that is valid but cannot be enforced in court is:", "o": ["unenforceable", "void", "voidable", "executed"], "a": 0, "why": "e.g., oral land contract."}, {"id": "N6-3", "q": "A contract signed by a minor is generally:", "o": ["voidable", "void", "executed", "unilateral"], "a": 0, "why": "Minor may disaffirm."}, {"id": "N6-4", "q": "A counteroffer:", "o": ["terminates the original offer", "keeps the original offer open", "is acceptance", "is a lease"], "a": 0, "why": "It is a rejection."}, {"id": "N6-5", "q": "An option contract is:", "o": ["unilateral", "bilateral", "implied", "void"], "a": 0, "why": "Only optionor is bound."}, {"id": "N6-6", "q": "A bilateral contract involves:", "o": ["a promise exchanged for a promise", "a promise for an act", "no consideration", "an oral agreement only"], "a": 0, "why": "Most sales contracts."}, {"id": "N6-7", "q": "The statute of frauds requires which contracts to be in writing?", "o": ["real estate sales contracts", "all verbal promises", "every lease of any length", "only mortgages"], "a": 0, "why": "Sale of land."}, {"id": "N6-8", "q": "A buyer's remedy to force the seller to convey is:", "o": ["specific performance", "liquidated damages", "novation", "rescission only"], "a": 0, "why": "Land is unique."}, {"id": "N6-9", "q": "'Time is of the essence' means:", "o": ["deadlines must be strictly met", "extensions are automatic", "performance is optional", "the contract is void"], "a": 0, "why": "Strict deadlines."}, {"id": "N6-10", "q": "A substitution of a new party that releases the original is:", "o": ["novation", "assignment", "rescission", "defeasance"], "a": 0, "why": "Novation."}, {"id": "N6-11", "q": "Earnest money in a broker's possession must be:", "o": ["held in a trust or escrow account", "deposited to the broker's operating account", "kept in cash", "given to the seller"], "a": 0, "why": "Never commingled."}, {"id": "N6-12", "q": "Fraud makes a contract:", "o": ["voidable", "void", "executed", "bilateral"], "a": 0, "why": "Defrauded party may rescind."}, {"id": "N6-13", "q": "Equitable title is held by the:", "o": ["buyer after signing the contract", "seller", "broker", "lender at all times"], "a": 0, "why": "Between contract and closing."}, {"id": "N6-14", "q": "Rescission:", "o": ["returns the parties to their pre-contract positions", "enforces the contract", "creates a lease", "transfers title"], "a": 0, "why": "Cancels."}], "drill": false}, {"id": "N7", "part": "National", "title": "Transfer of Title, Deeds, Title Insurance & Closing", "objectives": ["Identify voluntary and involuntary transfers", "Compare deed types and required elements", "Explain recording, notice and title evidence", "Walk through closing, prorations and settlement"], "lessons": [{"title": "Deeds and methods of transfer", "body": ["**Title** is the right to ownership; **deed** is the instrument that conveys it.", "**Essential elements of a valid deed**: (1) grantor with legal capacity, (2) identifiable grantee, (3) words of conveyance (granting clause), (4) adequate property description, (5) consideration recited (often nominal), (6) signed by the grantor, (7) **delivery and acceptance** (the deed is not effective until delivered with intent to pass title), and in most states acknowledged (notarized) to be recorded. A deed is valid even if not recorded; recording gives *constructive notice*.", "**Types of deeds**:", "- **General warranty deed** — the greatest protection: covenants of seisin, right to convey, against encumbrances, quiet enjoyment, warranty forever; warranties cover the *entire history* of title.", "- **Special warranty deed** — warrants only against defects arising during the grantor's ownership.", "- **Quitclaim deed** — conveys whatever interest the grantor has, **no warranties**; used to clear clouds on title.", "- **Bargain and sale deed** — implies the grantor owns but offers no warranty against encumbrances.", "- **Trustee's deed** (foreclosure), **sheriff's deed**, **executor's/administrator's deed**, **deed of gift**.", "**Voluntary alienation**: sale, gift, will. **Involuntary**: foreclosure, eminent domain, **adverse possession** (actual, open and notorious, hostile, exclusive, continuous for the statutory period—and in some states payment of taxes), escheat, bankruptcy, partition. **Descent** (intestate succession) transfers title by law to heirs; **testate** = with a will; **probate** validates the will. **Title by accession**: accretion, avulsion."], "key": ["Delivery and acceptance make a deed effective", "General warranty = broadest; quitclaim = no warranty", "Recording gives constructive notice, not validity"], "example": "Grandpa signs a deed and puts it in a drawer, intending it to pass at death. Without present delivery, no transfer occurs.", "confirm": []}, {"title": "Recording, title evidence and title insurance", "body": ["**Recording** places a document in the public record, in the county where the land lies, to give **constructive notice** to the world and establish **priority**. Most states are **race-notice** or **notice** jurisdictions. A buyer in possession gives **actual notice**. **Chain of title** is the history of ownership; a **title search** runs through it; an **abstract of title** summarizes recorded documents with an **attorney's opinion**; a **cloud on title** is a claim that might impair ownership (cured by a quitclaim deed or **quiet title** suit).", "**Title insurance** protects against defects that existed at the policy date but were unknown. One premium at closing. **Owner's policy** protects the buyer for as long as they or heirs hold the property; **lender's policy** protects the lender up to the loan balance and is nearly always required. **Standard coverage** excludes matters that a survey or inspection would show, plus zoning, easements not of record, and known defects. **Extended coverage (ALTA)** requires a survey and covers more.", "**Marketable title** is free from reasonable doubt; the buyer need not accept anything less. **Insurable title** can be insured even with exceptions.", "**Torrens system** — a government-guaranteed registration system, rare in the U.S. **Homestead** laws protect a portion of the home's equity from creditors."], "key": ["Recording = constructive notice; possession = actual (inquiry) notice", "Title insurance covers hidden past defects, not future ones", "Standard policy excludes survey matters"], "example": "A forged deed in the chain of title surfaces after closing. The owner's title policy defends the claim and covers loss up to the policy amount.", "confirm": []}, {"title": "Closing, settlement and prorations", "body": ["**Closing** (settlement) is the final step: documents signed, funds disbursed, deed delivered, loan recorded. It may be held by an attorney, title company or escrow agent. **Escrow** means a neutral party holds documents and funds until conditions are met (**delivery in escrow** makes the deed effective on satisfaction of conditions).", "**Typical steps**: final walk-through, review of Closing Disclosure, payoff of seller's liens, deed and lien recording, disbursements, commission payment.", "**Prorations** adjust for items that belong to buyer or seller by closing date: property taxes, insurance, HOA dues, rents (and security deposits transferred), interest on assumed loans, utilities. **Conventions**: taxes are generally paid in arrears (seller owes up to closing); unless otherwise stated, a **statutory year** uses 360 days (30-day months), while a **calendar year** uses actual days; **the buyer owns the closing day** unless the contract says otherwise; interest on loans is paid in arrears.", "**Debits and credits**: A **debit** is an amount a party owes; a **credit** is an amount that reduces what they owe or that they receive. For the buyer: purchase price (debit), earnest money (credit), loan amount (credit), seller credits (credit), prepaid taxes owed to seller (debit), points and fees (debit). For the seller: sale price (credit), payoff (debit), commission (debit), taxes owed (debit).", "**Post-closing**: recording, title policy issuance, delivery of keys. **Wire fraud** is a leading closing risk—verify wiring instructions by phone using a known number; never email account numbers; warn clients early."], "key": ["Buyer owns the closing day unless contract says otherwise", "Property taxes usually paid in arrears → seller owes buyer a credit", "Verify wiring instructions by phone"], "example": "Annual tax $2,400 unpaid at a June 30 closing under a 360-day year: seller owes 6 months → $1,200 credited to the buyer.", "confirm": []}], "quiz": [{"id": "N7-1", "q": "A deed becomes effective upon:", "o": ["delivery and acceptance", "signing only", "recording only", "notarization only"], "a": 0, "why": "Delivery with intent."}, {"id": "N7-2", "q": "The deed giving the broadest protection is the:", "o": ["general warranty deed", "quitclaim deed", "special warranty deed", "bargain and sale deed"], "a": 0, "why": "Covers full chain of title."}, {"id": "N7-3", "q": "A quitclaim deed:", "o": ["conveys whatever interest the grantor has, without warranties", "warrants the title", "guarantees against encumbrances", "can only be used by the government"], "a": 0, "why": "No warranty."}, {"id": "N7-4", "q": "Recording a deed gives:", "o": ["constructive notice", "actual notice only", "title insurance", "warranty"], "a": 0, "why": "Notice to the world."}, {"id": "N7-5", "q": "A claim that may impair title is a:", "o": ["cloud on title", "covenant", "easement in gross", "novation"], "a": 0, "why": "Cure by quiet title or quitclaim."}, {"id": "N7-6", "q": "Adverse possession requires possession that is:", "o": ["open, notorious, hostile, exclusive and continuous", "secret and occasional", "permitted by the owner", "shared with the owner"], "a": 0, "why": "Elements."}, {"id": "N7-7", "q": "An owner's title policy generally covers:", "o": ["hidden defects that existed at policy date", "future liens created by the owner", "physical defects", "market decline"], "a": 0, "why": "Past defects."}, {"id": "N7-8", "q": "Standard coverage title insurance generally excludes:", "o": ["matters a survey would reveal", "forgeries", "recorded liens", "undisclosed heirs"], "a": 0, "why": "Need extended coverage and a survey."}, {"id": "N7-9", "q": "At closing, the buyer's earnest money is shown as a:", "o": ["credit", "debit", "proration", "commission"], "a": 0, "why": "Reduces the cash due."}, {"id": "N7-10", "q": "Taxes unpaid at closing are generally:", "o": ["a credit to the buyer and debit to the seller", "a debit to the buyer", "ignored", "a seller credit"], "a": 0, "why": "Seller owes accrued taxes."}, {"id": "N7-11", "q": "Under common proration conventions, the closing day belongs to the:", "o": ["buyer", "seller", "lender", "title company"], "a": 0, "why": "Unless contract says otherwise."}, {"id": "N7-12", "q": "The best protection against wire fraud is to:", "o": ["verify wiring instructions by phone using a known number", "email the instructions", "text account numbers", "accept new instructions by email"], "a": 0, "why": "Call back."}, {"id": "N7-13", "q": "Transfer by will is called:", "o": ["testate succession", "descent", "escheat", "accretion"], "a": 0, "why": "Will = testate."}, {"id": "N7-14", "q": "A statutory year in prorations uses:", "o": ["360 days", "365 days", "366 days", "400 days"], "a": 0, "why": "30-day months."}], "drill": false}, {"id": "N8", "part": "National", "title": "Practice of Real Estate: Fair Housing, Disclosure & Ethics", "objectives": ["Apply the Fair Housing Act and ADA", "Avoid discriminatory advertising, steering and blockbusting", "Handle trust funds, antitrust, disclosure and technology risk"], "lessons": [{"title": "Fair housing and anti-discrimination", "body": ["The **Fair Housing Act (Title VIII, Civil Rights Act of 1968, as amended 1988)** prohibits discrimination in sale, rental, financing and advertising based on **race, color, religion, sex, national origin, familial status (children under 18, pregnant women, those securing custody), and disability**. The **Civil Rights Act of 1866** bans race discrimination in all property transactions with **no exemptions** (*Jones v. Mayer*). **Sexual orientation and gender identity** protections come from some state/local laws and HUD policy that has varied; confirm current enforcement.", "**Prohibited practices**: **steering** (guiding buyers toward or away from areas), **blockbusting/panic peddling** (inducing sales by claiming minority entry will reduce values), **redlining** (refusing loans or insurance by area), discriminatory advertising, refusing to show/sell/rent, different terms, **refusing reasonable accommodations or modifications for disabled person
